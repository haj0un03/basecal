<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>부대 달력</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <!-- 들어오기 전에는 앱 이름, 들어온 뒤에는 현재 사용자의 이름·보직·역할 -->
      <div id="topbar-title" class="topbar-title"><span class="app-title">부대 달력</span></div>
      <div class="user-area">
        <button type="button" id="user-button" class="user-button" aria-label="사용자 메뉴" aria-haspopup="true" aria-expanded="false" aria-controls="user-menu">⋮</button>
        <div id="user-menu" class="user-menu" hidden></div>
      </div>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="주요 메뉴">
    <div class="tabbar-inner">
      <a href="#calendar" class="tab" data-tab="calendar">달력</a>
      <a href="#apply" class="tab" data-tab="apply">신청</a>
    </div>
  </nav>

  <dialog id="member-dialog" class="dialog" aria-labelledby="member-dialog-title"></dialog>
  <dialog id="event-dialog" class="dialog" aria-labelledby="event-dialog-title"></dialog>
  <dialog id="leave-dialog" class="dialog" aria-labelledby="leave-dialog-title"></dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>

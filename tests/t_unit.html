<!doctype html><meta charset="utf-8"><body><pre id="result">running</pre>
<iframe id="f" style="width:360px;height:1400px;border:0"></iframe>
<script type="module">
const out = []; let pass = 0, fail = 0;
const check = (name, cond, extra = '') => { cond ? pass++ : fail++; out.push(`${cond ? 'PASS' : 'FAIL'} ${name} ${extra}`); };
const wait = (ms) => new Promise((res) => setTimeout(res, ms));
try {
  // ── 데이터 계층 ──
  localStorage.clear();
  const d = await import('./js/data.js');
  const { mockAuth, mockDb } = await import('./js/mock-data.js');
  const codeOf = (id) => mockAuth.find((a) => a.user_id === id).code;
  const on = (date) => d.getCalendarEvents(date, date);
  const base = { unit_category: 'event', title: '종교 행사', start_date: '2026-11-08', end_date: '', memo: '오전 10시' };

  check('들어오기 전 추가 불가', d.addUnitEvent(base).reason === 'forbidden');
  d.signIn('김하늘', codeOf('u01'));
  check('병사 추가 불가', d.addUnitEvent(base).reason === 'forbidden');
  check('병사 수정 불가', d.updateUnitEvent('e01', base).reason === 'forbidden');
  check('병사 삭제 불가', d.deleteUnitEvent('e01').reason === 'forbidden' && mockDb.events.some((e) => e.id === 'e01'));
  check('병사에겐 부대 일정 수정 표시 없음', on('2026-10-16').find((e) => e.id === 'e01').editable === false);
  d.signOut();
  d.signIn('백지훈', codeOf('o01'));
  check('간부에겐 부대 일정 수정 표시', on('2026-10-16').find((e) => e.id === 'e01').editable === true);
  const logsBefore = mockDb.audit_logs.length;
  let r = d.addUnitEvent(base, Date.parse('2026-10-23T09:00:00Z'));
  check('부대 일정 추가', r.ok && r.event.type === 'unit' && r.event.title === '종교 행사' && r.event.unit_category === 'event' && r.event.end_date === '2026-11-08', JSON.stringify(r.event));
  const newId = r.event.id;
  check('한 번만 저장(사람마다 복사 안 함)', mockDb.events.filter((e) => e.title === '종교 행사').length === 1);
  check('추가 기록(누가·언제·무엇)', mockDb.audit_logs.length === logsBefore + 1 && mockDb.audit_logs.at(-1).action === 'create_unit_event' && mockDb.audit_logs.at(-1).actor_id === 'o01' && mockDb.audit_logs.at(-1).target_id === newId && mockDb.audit_logs.at(-1).created_at === '2026-10-23T09:00:00.000Z');
  r = d.addUnitEvent({ unit_category: 'training', title: '○○작전 대비 훈련', memo: '세부 위치', start_date: '2026-11-16', end_date: '2026-11-20' });
  const tr = mockDb.events.find((e) => e.id === r.event.id);
  check('훈련은 제목·설명을 저장하지 않음', r.ok && tr.title === null && tr.memo === '', JSON.stringify(tr));
  check('훈련은 "훈련"으로 표시', on('2026-11-18').find((e) => e.id === tr.id).title === '훈련');
  check('훈련은 제목 없어도 됨', d.addUnitEvent({ unit_category: 'training', title: '', start_date: '2026-12-01' }).ok);
  const e = d.addUnitEvent({ unit_category: 'x', title: '', start_date: '' });
  check('입력 오류: 분류·제목·날짜', e.reason === 'invalid' && e.errors.unit_category && e.errors.title && e.errors.start_date, JSON.stringify(e.errors));
  check('입력 오류: 끝 날짜가 앞', !!d.addUnitEvent({ ...base, end_date: '2026-11-07' }).errors?.end_date);
  check('입력 오류: 설명 201자', !!d.addUnitEvent({ ...base, memo: '가'.repeat(201) }).errors?.memo);
  r = d.updateUnitEvent(newId, { ...base, title: '종교 행사(변경)', end_date: '2026-11-09' }, Date.parse('2026-10-23T10:00:00Z'));
  check('수정', r.ok && r.event.title === '종교 행사(변경)' && on('2026-11-09').some((x) => x.id === newId));
  check('수정 기록', mockDb.audit_logs.at(-1).action === 'update_unit_event' && mockDb.audit_logs.at(-1).target_id === newId);
  check('개인 일정은 부대 일정 함수로 못 고침', (() => { const p = d.addPersonalEvent({ kind: 'other', title: '내 일', start_date: '2026-11-08' }); return d.updateUnitEvent(p.event.id, base).reason === 'not_found' && d.deleteUnitEvent(p.event.id).reason === 'not_found'; })());
  d.signOut();
  d.signIn('남궁현', codeOf('o02'));
  check('다른 간부도 수정 가능', d.updateUnitEvent(newId, { ...base, title: '종교 행사' }).ok && mockDb.audit_logs.at(-1).actor_id === 'o02');
  d.signOut();
  d.signIn('이바다', codeOf('u02'));
  check('병사 달력에 새 부대 일정 보임', on('2026-11-08').some((x) => x.id === newId && x.title === '종교 행사'));
  check('간부의 개인 일정은 병사에게 안 보임', !on('2026-11-08').some((x) => x.title === '내 일'));
  d.signOut();
  d.signIn('백지훈', codeOf('o01'));
  check('삭제', d.deleteUnitEvent(newId).ok && !mockDb.events.some((x) => x.id === newId));
  check('삭제 기록', mockDb.audit_logs.at(-1).action === 'delete_unit_event' && mockDb.audit_logs.at(-1).target_id === newId);
  check('지운 것 다시 삭제', d.deleteUnitEvent(newId).reason === 'not_found');
  d.signOut();

  // ── 화면: Phase 2 완료 기준 ──
  localStorage.clear(); localStorage.setItem('basecal.session', '"o01"');
  const f = document.getElementById('f');
  await new Promise((res) => { f.onload = () => setTimeout(res, 300); f.src = 'index.html?u=1#calendar'; });
  const doc = f.contentDocument, w = f.contentWindow;
  // 훈련을 저장하면 "출타율 0%로 할까요?"를 묻는다 (11/7 추가). 이 점검에서는 "아니오"로 답한다
  w.confirm = () => false;
  const $ = (s) => doc.querySelector(s);
  const $$ = (s) => [...doc.querySelectorAll(s)];
  const goTo = async (y, m) => {
    for (let i = 0; i < 24; i++) {
      const [cy, cm] = $('.cal-title').textContent.match(/\d+/g).map(Number);
      if (cy === y && cm === m) return;
      $(`[data-action="${cy * 12 + cm < y * 12 + m ? 'next' : 'prev'}"]`).click(); await wait(20);
    }
  };
  const form = () => $('#event-dialog form');
  const barsOn = (date) => $$('.cal-bar').filter((b) => b.dataset.start <= date && date <= b.dataset.end);
  const menu = async (label) => { $('#user-button').click(); await wait(20); [...doc.querySelectorAll('.user-menu-item')].find((b) => b.textContent === label).click(); await wait(60); };

  check('간부: 부대 일정 추가 버튼', !!$('[data-action="add-unit-event"]') && $('[data-action="add-unit-event"]').textContent === '+ 부대 일정');
  check('예전 2-4 안내 문구 없음', !$$('.placeholder').some((p) => p.textContent.includes('2-4')));
  await goTo(2026, 11);
  $('.cal-day[data-date="2026-11-11"]').click(); await wait(30);
  $('[data-action="add-unit-event"]').click(); await wait(30);
  check('추가 창 열림', $('#event-dialog').open && $('#event-dialog h2').textContent === '부대 일정 추가');
  check('비밀 입력 금지 안내 항상 보임', $('.secret-warning')?.textContent.includes('비밀로 분류되는 내용은 입력 금지') && !$('.secret-warning').hidden);
  check('고른 날짜 미리 들어감', form().elements.start_date.value === '2026-11-11');
  check('기본 분류는 행사', form().elements.unit_category.value === 'event');
  form().querySelector('input[value="training"]').click(); await wait(20);
  check('훈련 고르면 제목·설명 숨김', form().querySelector('[data-field="title"]').hidden && form().querySelector('[data-field="memo"]').hidden && !form().querySelector('.training-help').hidden);
  check('훈련이어도 비밀 안내 보임', !$('.secret-warning').hidden);
  form().querySelector('input[value="event"]').click(); await wait(20);
  check('행사로 돌리면 제목 보임', !form().querySelector('[data-field="title"]').hidden);
  form().requestSubmit(); await wait(30);
  check('제목 없으면 안내', !$('[data-error-for="title"]').hidden && $('#event-dialog').open);
  form().elements.title.value = '체력 측정'; form().elements.end_date.value = '2026-11-12'; form().elements.memo.value = '연병장';
  form().requestSubmit(); await wait(60);
  check('저장하면 창 닫힘', !$('#event-dialog').open);
  check('간부 달력에 막대', barsOn('2026-11-11').some((b) => b.textContent === '체력 측정' && b.classList.contains('type-unit') && b.dataset.end === '2026-11-12'));
  const item = $$('.cal-event').find((x) => x.querySelector('.cal-event-title').textContent === '체력 측정');
  check('목록: 부대·행사·기간·설명', item?.querySelector('.type-badge').textContent === '부대' && item.querySelector('.cal-event-meta').textContent === '행사 · 11/11~11/12 · 연병장', item?.querySelector('.cal-event-meta')?.textContent);
  check('간부: 부대 일정에 수정·삭제', !!item.querySelector('.cal-event-actions'));
  // 훈련 등록
  $('[data-action="add-unit-event"]').click(); await wait(30);
  form().querySelector('input[value="training"]').click();
  form().elements.start_date.value = '2026-11-23'; form().elements.end_date.value = '2026-11-25';
  form().requestSubmit(); await wait(60);
  check('훈련 등록 → "훈련" 막대', barsOn('2026-11-24').some((b) => b.textContent === '훈련'));
  // 병사로 바꾸기
  await menu('로그아웃');
  const sf = $('.login-form'); sf.elements.name.value = '이바다'; sf.elements.code.value = (await import('./js/mock-data.js')).mockAuth.find((a) => a.user_id === 'u02').code; sf.requestSubmit(); await wait(100);
  check('병사로 바꿈', $('.topbar-name').textContent === '이바다');
  await goTo(2026, 11);
  check('★ Phase 2 완료 기준: 간부가 등록한 부대 일정이 병사 달력에 보임', barsOn('2026-11-11').some((b) => b.textContent === '체력 측정') && barsOn('2026-11-24').some((b) => b.textContent === '훈련'));
  $('.cal-day[data-date="2026-11-11"]').click(); await wait(30);
  const sItem = $$('.cal-event').find((x) => x.querySelector('.cal-event-title').textContent === '체력 측정');
  check('병사: 부대 일정에 수정·삭제 없음', sItem && !sItem.querySelector('.cal-event-actions'));
  check('병사: 부대 일정 추가 버튼 없음', !$('[data-action="add-unit-event"]'));
  // 다시 간부로: 수정·삭제
  await menu('로그아웃');
  const of = $('.login-form'); of.elements.name.value = '백지훈'; of.elements.code.value = (await import('./js/mock-data.js')).mockAuth.find((a) => a.user_id === 'o01').code; of.requestSubmit(); await wait(100);
  await goTo(2026, 11);
  $('.cal-day[data-date="2026-11-11"]').click(); await wait(30);
  let oItem = $$('.cal-event').find((x) => x.querySelector('.cal-event-title').textContent === '체력 측정');
  oItem.querySelector('.small-button').click(); await wait(30);
  check('수정 창: 값 채워짐', $('#event-dialog h2').textContent === '부대 일정 수정' && form().elements.title.value === '체력 측정' && form().elements.end_date.value === '2026-11-12' && form().elements.memo.value === '연병장');
  form().elements.title.value = '체력 측정(연기)'; form().elements.start_date.value = '2026-11-13'; form().elements.end_date.value = '';
  form().requestSubmit(); await wait(60);
  check('수정 반영: 날짜 이동', barsOn('2026-11-13').some((b) => b.textContent === '체력 측정(연기)') && !barsOn('2026-11-11').some((b) => b.textContent.startsWith('체력')));
  $('.cal-day[data-date="2026-11-24"]').click(); await wait(30);
  oItem = $$('.cal-event').find((x) => x.querySelector('.cal-event-title').textContent === '훈련');
  oItem.querySelector('.small-button').click(); await wait(30);
  check('훈련 수정 창: 제목 칸 비어 있고 숨김', form().elements.unit_category.value === 'training' && form().elements.title.value === '' && form().querySelector('[data-field="title"]').hidden);
  $('#event-dialog [data-action="close"]').click(); await wait(30);
  let asked = '';
  w.confirm = (q) => { asked = q; return true; };
  $$('.cal-event').find((x) => x.querySelector('.cal-event-title').textContent === '훈련').querySelector('.danger').click(); await wait(40);
  check('삭제 확인 문구: 모든 사람 달력에서 사라짐', asked.includes('모든 사람의 달력에서 사라집니다'), asked);
  check('삭제 반영', !barsOn('2026-11-24').length);
  check('360px 가로 넘침 없음', doc.documentElement.scrollWidth <= 360, doc.documentElement.scrollWidth);
} catch (err) { fail++; out.push('ERROR ' + err.stack); }
document.getElementById('result').textContent = `통과 ${pass} / 실패 ${fail}\n` + out.join('\n');
</script>

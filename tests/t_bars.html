<!doctype html><meta charset="utf-8"><body><pre id="result">running</pre>
<iframe id="f" style="width:360px;height:1200px;border:0"></iframe>
<script type="module">
const out = []; let pass = 0, fail = 0;
const check = (name, cond, extra = '') => { cond ? pass++ : fail++; out.push(`${cond ? 'PASS' : 'FAIL'} ${name} ${extra}`); };
const wait = (ms) => new Promise((res) => setTimeout(res, ms));
try {
  localStorage.clear(); localStorage.setItem('basecal.session', '"u01"');
  const f = document.getElementById('f');
  await new Promise((res) => { f.onload = () => setTimeout(res, 300); f.src = 'index.html?b=1#calendar'; });
  const doc = f.contentDocument, w = f.contentWindow;
  const $ = (s) => doc.querySelector(s);
  const $$ = (s) => [...doc.querySelectorAll(s)];
  const goTo = async (y, m) => {
    for (let i = 0; i < 24; i++) {
      const [cy, cm] = $('.cal-title').textContent.match(/\d+/g).map(Number);
      if (cy === y && cm === m) return;
      $(`[data-action="${cy * 12 + cm < y * 12 + m ? 'next' : 'prev'}"]`).click(); await wait(20);
    }
  };
  const add = async (kind, title, start, end = '') => {
    $('[data-action="add-event"]').click(); await wait(20);
    const fm = $('#event-dialog form');
    fm.querySelector(`input[value="${kind}"]`)?.click();
    fm.elements.title.value = title; fm.elements.start_date.value = start; fm.elements.end_date.value = end;
    fm.requestSubmit(); await wait(40);
  };
  const bars = (title) => $$('.cal-bar').filter((b) => b.textContent === title);
  const row = (b) => b.style.gridRow;
  const week = (b) => b.closest('.cal-week');

  await goTo(2026, 10);
  // 주가 바뀌는 일정: 10/9(금) ~ 10/13(화)
  await add('duty', '파견', '2026-10-09', '2026-10-13');
  await goTo(2026, 10);
  let b = bars('파견');
  check('주가 바뀌면 막대 2개', b.length === 2, b.length);
  check('첫 막대: 10/9~10/10, 오른쪽 이어짐', b[0].dataset.start === '2026-10-09' && b[0].dataset.end === '2026-10-10' && b[0].classList.contains('cont-right') && !b[0].classList.contains('cont-left'));
  check('둘째 막대: 10/11~10/13, 왼쪽 이어짐', b[1].dataset.start === '2026-10-11' && b[1].dataset.end === '2026-10-13' && b[1].classList.contains('cont-left') && !b[1].classList.contains('cont-right'));
  check('새 줄에서 글자 다시 씀', b.every((x) => x.textContent === '파견'));
  check('막대가 칸을 이어서 차지', b[0].style.gridColumn === '6 / 8' && b[1].style.gridColumn === '1 / 4', `${b[0].style.gridColumn} | ${b[1].style.gridColumn}`);
  check('글자 가운데 정렬', w.getComputedStyle(b[1]).textAlign === 'center');
  check('막대는 클릭을 받지 않음', w.getComputedStyle(b[1]).pointerEvents === 'none');
  const rect = b[1].getBoundingClientRect();
  const under = doc.elementFromPoint(rect.left + rect.width * 0.5, rect.top + rect.height / 2)?.closest('.cal-day');
  check('막대를 누르면 아래 날짜가 눌림', under?.dataset.date === '2026-10-12', under?.dataset.date);
  under.click(); await wait(30);
  check('그날 목록에 일정', $$('.cal-event-title').some((x) => x.textContent === '파견'));
  check('막대가 여러 칸 폭', bars('파견')[1].getBoundingClientRect().width > $('.cal-day[data-date="2026-10-11"]').getBoundingClientRect().width * 2.5);

  // 달이 바뀌는 일정: 10/30 ~ 11/2
  await goTo(2026, 10);
  await add('other', '외박 준비', '2026-10-30', '2026-11-02');
  await goTo(2026, 10);
  b = bars('외박 준비');
  check('10월: 10/30~10/31, 오른쪽 이어짐', b.length === 1 && b[0].dataset.end === '2026-10-31' && b[0].classList.contains('cont-right'));
  await goTo(2026, 11);
  b = bars('외박 준비');
  check('11월: 11/1~11/2, 왼쪽 이어짐', b.length === 1 && b[0].dataset.start === '2026-11-01' && b[0].dataset.end === '2026-11-02' && b[0].classList.contains('cont-left') && !b[0].classList.contains('cont-right'));

  // 줄 나누기: 11/9(월)~11/11 A, 11/10 B, 11/11~11/12 C, 11/11 D
  await add('duty', 'A근무', '2026-11-09', '2026-11-11');
  await add('other', 'B', '2026-11-10');
  await add('other', 'C', '2026-11-11', '2026-11-12');
  await add('other', 'D', '2026-11-11');
  await goTo(2026, 11);
  const [A, B, C] = ['A근무', 'B', 'C'].map((t) => bars(t)[0]);
  check('긴 일정이 윗줄', row(A) === '2', row(A));
  check('겹치는 일정은 다음 줄', row(B) === '3', row(B));
  check('11/11: A·C·D가 겹쳐 D는 숨김', !bars('D').length || (bars('D').length === 0));
  const more = [...week(A).querySelectorAll('.cal-more')];
  check('넘친 개수 +N 표시', more.length >= 1 && more.some((m) => m.textContent === '+2' || m.textContent === '+1'), more.map((m) => `${m.style.gridColumn}:${m.textContent}`).join());
  const cell11 = $('.cal-day[data-date="2026-11-11"]');
  check('날짜 칸 읽어주기에 모든 일정', ['A근무', 'C', 'D'].every((t) => cell11.getAttribute('aria-label').includes(t)) && cell11.getAttribute('aria-label').includes('일정 3개'), cell11.getAttribute('aria-label'));
  cell11.click(); await wait(30);
  check('목록에는 숨긴 일정도 나옴', ['A근무', 'C', 'D'].every((t) => $$('.cal-event-title').some((x) => x.textContent === t)));
  check('360px 가로 넘침 없음', doc.documentElement.scrollWidth <= 360, doc.documentElement.scrollWidth);
  check('주 줄 개수', $$('.cal-week').length === 5, $$('.cal-week').length);
} catch (err) { fail++; out.push('ERROR ' + err.stack); }
document.getElementById('result').textContent = `통과 ${pass} / 실패 ${fail}\n` + out.join('\n');
</script>

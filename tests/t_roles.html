<!doctype html><meta charset="utf-8"><body><pre id="result">running</pre>
<iframe id="f" style="width:360px;height:640px"></iframe>
<script type="module">
const out = []; let pass = 0, fail = 0;
const check = (name, cond, extra = '') => { cond ? pass++ : fail++; out.push(`${cond ? 'PASS' : 'FAIL'} ${name} ${extra}`); };
const f = document.getElementById('f');
let n = 0;
const load = (hash) => new Promise((res) => { f.onload = () => setTimeout(res, 300); f.src = `index.html?r=${++n}${hash}`; });
const wait = (ms) => new Promise((res) => setTimeout(res, ms));
const menuItems = () => [...f.contentDocument.querySelectorAll('.user-menu-item')].map((b) => b.textContent);
const texts = (sel) => [...f.contentDocument.querySelectorAll(sel)].map((e) => e.textContent);
try {
  for (const [id, role] of [['u01', 'soldier'], ['o01', 'officer']]) {
    localStorage.clear(); localStorage.setItem('basecal.session', JSON.stringify(id));
    await load('');
    const isOfficer = role === 'officer';
    const items = menuItems();
    check(`${id} 메뉴: 인원 추가 ${isOfficer ? '보임' : '안 보임'}`, items.includes('인원 추가·코드 발급') === isOfficer, JSON.stringify(items));
    check(`${id} 메뉴: 코드 다시 발급 ${isOfficer ? '보임' : '안 보임'}`, items.includes('코드 다시 발급') === isOfficer);
    check(`${id} 메뉴: 로그아웃`, items.includes('로그아웃'));
    check(`${id} 메뉴: 비밀번호 변경 없음`, !items.some((t) => t.includes('비밀번호')));
    check(`${id} 달력: 부대 일정 추가 버튼 ${isOfficer ? '있음' : '없음'}`, !!f.contentDocument.querySelector('[data-action="add-unit-event"]') === isOfficer);
    await load('#apply');
    const all = texts('.placeholder').join(' | ');
    check(`${id} 신청: 위쪽 탭 휴가·근무·시설, 처음엔 휴가`, texts('.subtab').join() === (isOfficer ? '휴가,근무,시설' : '휴가,근무 교대,시설') && texts('h2').join() === '휴가');
    check(`${id} 신청: 휴가 신청 상자 ${isOfficer ? '없음' : '있음'}`, !!f.contentDocument.querySelector('.apply-box:not(.roster-box)') !== isOfficer);
    check(`${id} 신청: 출타율 설정 ${isOfficer ? '있음' : '없음'}`, !!f.contentDocument.querySelector('.rate-form') === isOfficer);
    await load('#apply/facility');
    check(`${id} 시설: 예약 달력 있음, 승인 대기·시설 막기 ${isOfficer ? '있음' : '없음'}`, !!f.contentDocument.querySelector('.fac-cal') && !!f.contentDocument.querySelector('.fac-pending-head') === isOfficer && !!f.contentDocument.querySelector('[data-action="add-block"]') === isOfficer);
  }
} catch (e) { fail++; out.push('ERROR ' + e.stack); }
document.getElementById('result').textContent = `통과 ${pass} / 실패 ${fail}\n` + out.join('\n');
</script>

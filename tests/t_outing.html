<!doctype html><meta charset="utf-8"><body><pre id="result">running</pre>
<iframe id="f" style="width:360px;height:2400px;border:0"></iframe>
<script type="module">
const out = []; let pass = 0, fail = 0;
const check = (name, cond, extra = '') => { cond ? pass++ : fail++; out.push(`${cond ? 'PASS' : 'FAIL'} ${name} ${extra}`); };
const wait = (ms) => new Promise((res) => setTimeout(res, ms));
try {
  // ── 데이터 계층 (2026-10-24 토요일 기준) ──
  localStorage.clear();
  const d = await import('./js/data.js');
  const { mockAuth, mockDb } = await import('./js/mock-data.js');
  const codeOf = (id) => mockAuth.find((a) => a.user_id === id).code;
  const NOW = new Date(2026, 9, 24, 9).getTime();
  const as = (id) => { d.signOut(); d.signIn(mockDb.profiles.find((p) => p.id === id).name, codeOf(id)); };
  const go = (id, kind, s, e, usePass = false) => { as(id); return d.applyAbsence({ kind, start_date: s, end_date: e, use_pass: usePass }, NOW); };
  const passes = () => Object.fromEntries(d.getMyPassSummary().map((x) => [x.type, x.remaining]));
  const slot = (date, kind) => d.getDayAvailability(kind, date, date)[0];

  as('o01');
  check('간부는 외박·외출 신청 불가', d.applyAbsence({ kind: 'outing', start_date: '2026-10-27' }, NOW).reason === 'forbidden');
  as('u01');
  check('잘못된 종류', d.applyAbsence({ kind: 'leave', start_date: '2026-10-27' }, NOW).errors?.kind);
  check('외출은 하루만', go('u01', 'outing', '2026-10-27', '2026-10-28').errors?.dates?.includes('하루만'));
  check('한 달 밖 불가', go('u01', 'outing', '2026-11-25').errors?.dates?.includes('한 달 이내'));
  check('★ 외박은 금요일 출발 불가', go('u01', 'overnight', '2026-10-30').errors?.dates?.includes('토요일 출발'));
  check('★ 외박 2박 불가', go('u01', 'overnight', '2026-10-31', '2026-11-02').errors?.dates?.includes('1박 2일'));
  const before = JSON.stringify(d.getMyLeaveSummary());
  let r = go('u01', 'overnight', '2026-10-31');
  check('★ 외박 토 10/31 → 일 11/1 자동', r.ok && r.request.start_date === '2026-10-31' && r.request.end_date === '2026-11-01' && !r.request.reward_pass);
  const ev = mockDb.events.find((e) => e.id === r.request.event_id);
  check('달력용 일정: 외박, 본인', ev.type === 'overnight' && ev.title === '외박' && ev.author_id === 'u01');
  check('외박은 휴가 일수를 안 씀', JSON.stringify(d.getMyLeaveSummary()) === before);
  check('내 다른 출타와 겹치면 불가', go('u01', 'outing', '2026-11-01').errors?.dates?.includes('겹칩니다'));
  check('휴가와도 겹치면 불가', (() => { as('u01'); return d.applyLeave({ start_date: '2026-10-31', end_date: '2026-10-31', items: { annual: 1 } }, NOW).errors?.dates?.includes('겹칩니다'); })());
  as('u01');
  let q = d.getMyAbsenceQuota('2026-11-10');
  check('횟수: 10~12월 외박 1', q.quarter.label === '10~12월' && q.quarter.overnight === 1 && q.limits.overnight === 1 && q.limits.weekendOuting === 2 && q.limits.weekend === 1 && q.limits.weekdayOuting === 2);
  check('횟수: 10월 외박·주말 외출 1, 11월 0', d.getMyAbsenceQuota('2026-10-05').month.weekend === 1 && q.month.weekend === 0);
  check('★ 분기 외박 1회 다 씀', go('u01', 'overnight', '2026-11-07').errors?.dates?.includes('외박 1회를 이미'));
  check('★ 외박 쓴 달(10월)엔 주말 외출 불가', go('u01', 'outing', '2026-10-25').errors?.dates?.includes('10월에 이미 외박이나 주말 외출'));
  check('★ 외박 쓴 분기라도 다음 달(11월) 주말 외출은 가능', go('u01', 'outing', '2026-11-08').ok);
  check('★ 11월에 주말 외출 또 불가 (한 달에 1개)', go('u01', 'outing', '2026-11-15').errors?.dates?.includes('11월에 이미'));
  as('u01');
  check('다음 분기는 새로 셈', d.getMyAbsenceQuota('2027-01-10').quarter.label === '1~3월' && d.getMyAbsenceQuota('2027-01-10').quarter.overnight === 0);

  // 포상 외출 1회 사용 (횟수에 안 들어감)
  check('김하늘 포상 외출 1회', passes().outing_pass === 1 && passes().overnight_pass === 0);
  r = go('u01', 'outing', '2026-10-27', '', true);
  check('포상 외출로 신청 → 1회 차감', r.ok && r.request.reward_pass === true && passes().outing_pass === 0);
  as('u01');
  check('★ 포상 외출은 평일 외출 횟수에 안 들어감', d.getMyAbsenceQuota('2026-10-27').month.weekdayOuting === 0);
  check('남은 포상 없으면 포상 사용 불가', go('u01', 'outing', '2026-10-28', '', true).errors?.use_pass?.includes('없습니다'));
  check('포상 외박 0회라 불가', go('u01', 'overnight', '2026-11-07', '', true).errors?.use_pass);
  check('평일 외출 10/28', go('u01', 'outing', '2026-10-28').ok);
  check('평일 외출 10/29', go('u01', 'outing', '2026-10-29').ok);
  check('★ 한 달 평일 외출 2회 다 씀', go('u01', 'outing', '2026-10-30').errors?.dates?.includes('평일 외출 2회를 모두'));
  check('다음 달은 새로 셈 (11/2 평일 외출)', go('u01', 'outing', '2026-11-02').ok);
  as('u01');
  d.cancelLeaveRequest(r.request.id);
  check('포상 외출 취소하면 1회 돌아옴', passes().outing_pass === 1);
  r = go('u01', 'outing', '2026-10-30', '', true);
  check('★ 횟수를 다 써도 포상 외출은 가능', r.ok && r.request.reward_pass === true);

  // 한 분기에 외박 1 + 주말 외출 2를 한 달에 1개씩 (이바다 u02)
  check('주말 외출 일 10/25', go('u02', 'outing', '2026-10-25').ok);
  check('주말 외출 일 11/1', go('u02', 'outing', '2026-11-01').ok);
  check('★ 11월 외박 불가 (11월에 주말 외출 씀)', go('u02', 'overnight', '2026-11-07').errors?.dates?.includes('11월에 이미'));
  check('평일 외출은 따로 가능', go('u02', 'outing', '2026-11-03').ok);
  as('u02');
  q = d.getMyAbsenceQuota('2026-11-03');
  check('횟수: 주말 외출 2, 11월 외박·주말 1, 평일 외출 1', q.quarter.weekendOuting === 2 && q.quarter.overnight === 0 && q.month.label === '11월' && q.month.weekend === 1 && q.month.weekdayOuting === 1);
  const NOW2 = new Date(2026, 10, 25, 9).getTime();
  const go2 = (id, kind, s) => { as(id); return d.applyAbsence({ kind, start_date: s }, NOW2); };
  check('★ 주말 외출 2회 쓴 분기에도 12월 외박 가능', go2('u02', 'overnight', '2026-12-05').ok);
  check('★ 분기 주말 외출 2회 다 씀', go2('u02', 'outing', '2026-12-13').errors?.dates?.includes('주말 외출 2회를 모두'));

  // 총 출타 정원 (병사 20명 × 35% = 7). 11/12: 휴가 4명
  check('11/12 외출 3자리(총 7 − 휴가 4)', slot('2026-11-12', 'outing').remaining === 3);
  check('평일 외출 3명', ['u11', 'u12', 'u13'].every((u) => go(u, 'outing', '2026-11-12').ok));
  check('총 출타 7/7 → 외출·외박 마감', slot('2026-11-12', 'overnight').full && go('u14', 'outing', '2026-11-12').errors?.dates?.includes('마감'));
  check('11/14(토) 외박 7명으로 총 출타를 채움', ['u11', 'u12', 'u13', 'u14', 'u15', 'u16', 'u17'].every((u) => go(u, 'overnight', '2026-11-14').ok));
  check('★ 외박으로 총 출타가 차면 휴가도 마감', slot('2026-11-15', 'leave').full && (() => { as('u18'); return d.applyLeave({ start_date: '2026-11-14', end_date: '2026-11-14', items: { annual: 1 } }, NOW).reason === 'invalid'; })());
  as('u15');
  d.cancelLeaveRequest(d.getMyLeaveRequests().find((x) => x.start_date === '2026-11-14').id);
  check('외박 1명 취소 → 자리 열림', slot('2026-11-14', 'leave').remaining === 1);
  as('o01');
  const roster = d.getAbsenceRoster('2026-11-12', '2026-11-12')[0];
  check('간부 명단: 휴가 4·외출 3, 총 7/7', roster.total.count === 7 && roster.people.filter((p) => p.kind === 'outing').length === 3 && roster.totalFull);
  d.signOut();

  // ── 화면 ──
  const f = document.getElementById('f');
  localStorage.clear(); localStorage.setItem('basecal.session', '"u01"');
  await new Promise((res) => { f.onload = () => setTimeout(res, 300); f.src = 'index.html?o=1#apply'; });
  const doc = f.contentDocument, w = f.contentWindow;
  const $ = (q) => doc.querySelector(q);
  const $$ = (q) => [...doc.querySelectorAll(q)];
  const fd = await import('./js/data.js?frame-out');
  const win = fd.getApplyWindow();
  const add = (s, n) => { const [y, m, dd] = s.split('-').map(Number); const x = new Date(y, m - 1, dd + n); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
  const dow = (s) => { const [y, m, dd] = s.split('-').map(Number); return new Date(y, m - 1, dd).getDay(); };
  const firstFrom = (s, ok) => { let x = s; while (!ok(dow(x))) x = add(x, 1); return x; };
  const cell = (date) => $(`.apply-box:not(.roster-box) .apply-day[data-date="${date}"]`);
  const goMonth = async (date) => { const [y, m] = date.split('-').map(Number); for (let i = 0; i < 4; i++) { const [cy, cm] = $('.apply-box:not(.roster-box) .apply-month').textContent.match(/\d+/g).map(Number); if (cy === y && cm === m) return; $(`[data-action="${cy * 12 + cm < y * 12 + m ? 'apply-next' : 'apply-prev'}"]`).click(); await wait(30); } };
  const kindBtn = (k) => $(`.apply-kind[data-kind="${k}"]`);
  check('제목 "출타 신청", 종류 3개', $('.apply-title').textContent === '출타 신청' && $$('.apply-kind').map((b) => b.textContent).join() === '휴가,외박,외출');
  check('처음엔 휴가 선택, 횟수 안내 없음', kindBtn('leave').getAttribute('aria-pressed') === 'true' && !$('.apply-quota'));
  // 외출: 한 번 누르면 하루
  kindBtn('outing').click(); await wait(30);
  check('외출 안내', $('.apply-guide').textContent.startsWith('외출할 날을 누르세요'));
  check('★ 횟수 안내 (외박·주말 외출 / 평일 외출)', /외박 0\/1 · 주말 외출 0\/2/.test($('.apply-quota')?.textContent) && /월: 외박·주말 외출 0\/1 · 평일 외출 0\/2/.test($('.apply-quota').textContent));
  const o1 = firstFrom(add(win.start, 3), (x) => x >= 1 && x <= 5);
  await goMonth(o1);
  cell(o1).click(); await wait(30);
  check('평일이면 "평일 외출 (하루)"', $('.apply-range').textContent.includes('평일 외출 (하루)'));
  const passBox = () => $('.apply-form input[name="use_pass"]');
  check('포상 외출 쓰기(남은 1회) 고를 수 있음', !passBox().disabled && $('.apply-pass').textContent.includes('포상 외출로 쓰기 (남은 1회)'));
  check('포상은 횟수에 안 들어간다는 안내', $('.apply-form .help').textContent.includes('횟수에 들어가지 않습니다'));
  passBox().click(); $('.apply-form').requestSubmit(); await wait(50);
  check('포상 외출 신청 안내', $('.apply-message')?.textContent.includes('포상 외출 자리를 확보했습니다'));
  check('포상 외출 0회로 줄어듦', $$('.pass-chip').find((c) => c.dataset.passType === 'outing_pass')?.textContent === '포상 외출 0회');
  await goMonth(o1);
  check('신청 달력에 "외출" 막대(외출 색)', [...doc.querySelectorAll('.apply-bar')].some((b) => b.textContent === '외출' && b.classList.contains('type-outing') && b.dataset.start === o1));
  const item = () => $$('.request-list .grant-item').find((x) => x.dataset.kind === 'outing');
  check('내 출타 신청 내역: 평일 외출 · 포상 외출 사용', item()?.querySelector('.type-badge').textContent === '외출' && item().querySelector('.grant-meta').textContent === '평일 외출 · 포상 외출 사용');
  // 외박: 토요일만
  kindBtn('overnight').click(); await wait(30);
  check('외박 안내: 토요일', $('.apply-guide').textContent.includes('외박할 토요일을 누르세요'));
  const sat = firstFrom(add(win.start, 1), (x) => x === 6);
  const fri = add(sat, -1), sun = add(sat, 1);
  await goMonth(fri);
  check('★ 외박이면 금요일은 못 누름', cell(fri).disabled && cell(fri).classList.contains('not-allowed') && cell(fri).getAttribute('aria-label').includes('토요일 출발만'));
  await goMonth(sat);
  check('토요일은 누를 수 있음', !cell(sat).disabled);
  cell(sat).click(); await wait(30);
  check('★ 토요일 누르면 1박 2일', $('.apply-range').textContent.includes('외박 (1박 2일)'));
  await goMonth(sun);
  check('일요일이 복귀일로 표시', cell(sun).classList.contains('range-end'));
  check('포상 외박 0회면 막고 안내', passBox().disabled && $('.apply-form .help').textContent.includes('일반 외박으로 신청합니다'));
  $('.apply-form').requestSubmit(); await wait(50);
  check('외박 신청', $('.apply-message')?.textContent.includes('외박 자리를 확보했습니다'));
  check('★ 횟수 안내가 외박 1/1로', /외박 1\/1/.test($('.apply-quota')?.textContent));
  check('휴가 카드 그대로(외박은 일수 안 씀)', $('.leave-card[data-leave-type="annual"] .leave-card-remaining').textContent === '24일');
  const ov = $$('.request-list .grant-item').find((x) => x.dataset.kind === 'overnight');
  check('내역: 외박 · 일반', ov?.querySelector('.grant-meta').textContent === '외박 · 일반');
  // 취소
  w.confirm = () => true;
  item().querySelector('.danger').click(); await wait(50);
  check('포상 외출 취소 → 1회 돌아옴', $$('.pass-chip').find((c) => c.dataset.passType === 'outing_pass')?.textContent === '포상 외출 1회' && $('.apply-message').textContent.includes('1회가 되돌아왔습니다'));
  // 달력 탭
  w.location.hash = '#calendar'; await wait(80);
  const [cy, cm] = sat.split('-').map(Number);
  for (let i = 0; i < 3 && $('.cal-title').textContent.trim() !== `${cy}년 ${cm}월`; i++) { $('[data-action="next"]').click(); await wait(30); }
  check('달력 탭에 "외박" 막대(외박 색)', [...doc.querySelectorAll('.cal-bar')].some((b) => b.textContent === '외박' && b.classList.contains('type-overnight')));
  check('360px 가로 넘침 없음', doc.documentElement.scrollWidth <= 360, doc.documentElement.scrollWidth);
} catch (err) { fail++; out.push('ERROR ' + err.stack); }
document.getElementById('result').textContent = `통과 ${pass} / 실패 ${fail}\n` + out.join('\n');
</script>

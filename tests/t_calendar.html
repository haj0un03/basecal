<!doctype html><meta charset="utf-8"><body><pre id="result">running</pre>
<iframe id="f" style="width:360px;height:1200px;border:0"></iframe>
<script type="module">
const out = []; let pass = 0, fail = 0;
const check = (name, cond, extra = '') => { cond ? pass++ : fail++; out.push(`${cond ? 'PASS' : 'FAIL'} ${name} ${extra}`); };
const wait = (ms) => new Promise((res) => setTimeout(res, ms));
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
try {
  // ── 데이터 계층 ──
  localStorage.clear();
  const d = await import('./js/data.js');
  const { mockAuth } = await import('./js/mock-data.js');
  check('들어오기 전엔 일정 없음', d.getCalendarEvents('2026-10-01', '2026-10-31').length === 0);
  d.signIn('김하늘', mockAuth.find((a) => a.user_id === 'u01').code);
  const oct = d.getCalendarEvents('2026-10-01', '2026-10-31');
  check('10월 부대 일정 3개', oct.length === 3, oct.map((e) => e.title).join());
  const training = oct.find((e) => e.unit_category === 'training');
  check('훈련은 "훈련"으로만', training.title === '훈련' && training.memo === '');
  check('행사 설명은 보임', oct.find((e) => e.id === 'e01').memo === '중대 대항 체육대회');
  check('기간 일정: 하루만 걸쳐도 포함', d.getCalendarEvents('2026-10-27', '2026-10-27').map((e) => e.id).join() === 'e03');
  check('경계: 10/30 포함', d.getCalendarEvents('2026-10-30', '2026-10-30').length === 1);
  check('경계: 10/31 제외', d.getCalendarEvents('2026-10-31', '2026-10-31').length === 0);
  check('11월 일정 없음', d.getCalendarEvents('2026-11-01', '2026-11-30').length === 0);
  check('원본 데이터는 그대로', (await import('./js/mock-data.js')).mockDb.events.find((e) => e.id === 'e03').title === null);
  d.signOut();

  // ── 화면 ──
  const today = new Date();
  const todayISO = iso(today);
  const f = document.getElementById('f');
  let n = 0;
  const load = (id, hash = '#calendar') => new Promise((res) => {
    localStorage.clear(); localStorage.setItem('basecal.session', JSON.stringify(id));
    f.onload = () => setTimeout(res, 300); f.src = `index.html?r=${++n}${hash}`;
  });
  await load('u01');
  let doc = f.contentDocument;
  const $ = (s) => doc.querySelector(s);
  const $$ = (s) => [...doc.querySelectorAll(s)];
  const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
  check('달 제목', $('.cal-title').textContent === `${today.getFullYear()}년 ${today.getMonth() + 1}월`, $('.cal-title').textContent);
  check('날짜 칸 수', $$('.cal-day').length === daysInMonth);
  const firstDay = $('.cal-day'); const leading = $$('.cal-blank').filter((b) => b.compareDocumentPosition(firstDay) & Node.DOCUMENT_POSITION_FOLLOWING).length;
  check('1일 앞 빈칸', leading === new Date(today.getFullYear(), today.getMonth(), 1).getDay(), leading);
  check('요일 줄', $$('.cal-weekday').map((e) => e.textContent).join('') === '일월화수목금토');
  const todayCell = $('.cal-day.today');
  check('오늘 강조', todayCell?.dataset.date === todayISO && todayCell.getAttribute('aria-current') === 'date');
  check('처음엔 오늘 선택', todayCell.classList.contains('selected') && todayCell.getAttribute('aria-pressed') === 'true');
  const expectD = Math.round((Date.UTC(2026, 10, 3) - Date.UTC(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);
  const expectText = expectD > 0 ? `전역까지 D-${expectD}` : expectD === 0 ? '오늘 전역합니다 (D-Day)' : '전역일이 지났습니다';
  check('전역 D-day', $('.dday strong').textContent === expectText, $('.dday').textContent);
  check('전역 예정일 표시', $('.dday').textContent.includes('2026-11-03'));

  // 2026년 10월로 맞춘다 (오늘이 10월이 아니어도 되게)
  const goTo = async (y, m) => {
    for (let i = 0; i < 24; i++) {
      const [cy, cm] = $('.cal-title').textContent.match(/\d+/g).map(Number);
      if (cy === y && cm === m) return;
      const before = cy * 12 + cm < y * 12 + m;
      $(`[data-action="${before ? 'next' : 'prev'}"]`).click(); await wait(20);
    }
  };
  await goTo(2026, 10);
  const cell = (date) => $(`.cal-day[data-date="${date}"]`);
  const barsOn = (date) => [...doc.querySelectorAll('.cal-bar')].filter((b) => b.dataset.start <= date && date <= b.dataset.end);
  check('10/16 막대: 체육대회', barsOn('2026-10-16').length === 1 && barsOn('2026-10-16')[0].textContent === '체육대회');
  check('막대는 부대 색 종류', barsOn('2026-10-16')[0].classList.contains('type-unit'));
  check('10/26~30 훈련은 막대 하나', $$('.cal-bar').filter((b) => b.textContent === '훈련').length === 1 && barsOn('2026-10-26')[0]?.dataset.end === '2026-10-30');
  check('10/25, 10/31 막대 없음', barsOn('2026-10-25').length === 0 && barsOn('2026-10-31').length === 0);
  check('칸 읽어주기 문구', cell('2026-10-21').getAttribute('aria-label').includes('일정 1개'), cell('2026-10-21').getAttribute('aria-label'));
  cell('2026-10-21').click(); await wait(30);
  check('날짜 누르면 목록 제목', $('.cal-day-list h3').textContent === '10월 21일 (수)', $('.cal-day-list h3').textContent);
  check('목록: 부대 · 생활관 점검 · 점검', $('.cal-event .type-badge').textContent === '부대' && $('.cal-event-title').textContent === '생활관 점검' && $('.cal-event-meta').textContent === '점검');
  check('누른 칸에 초점 유지', doc.activeElement === cell('2026-10-21'));
  check('선택 표시 이동', cell('2026-10-21').classList.contains('selected') && $$('.cal-day.selected').length === 1);
  cell('2026-10-27').click(); await wait(30);
  check('훈련 목록: 기간만, 설명 없음', $('.cal-event-title').textContent === '훈련' && $('.cal-event-meta').textContent === '10/26~10/30');
  cell('2026-10-16').click(); await wait(30);
  check('행사 목록: 분류와 설명', $('.cal-event-meta').textContent === '행사 · 중대 대항 체육대회', $('.cal-event-meta').textContent);
  cell('2026-10-02').click(); await wait(30);
  check('일정 없는 날', $('.cal-empty')?.textContent === '일정이 없습니다.');
  $('[data-action="next"]').click(); await wait(30);
  check('다음 달', $('.cal-title').textContent === '2026년 11월' && $$('.cal-day').length === 30);
  check('다음 달은 1일 선택 (이번 달이면 오늘)', $('.cal-day.selected')?.dataset.date === (todayISO.startsWith('2026-11') ? todayISO : '2026-11-01'));
  check('다음 버튼에 초점 유지', doc.activeElement === $('[data-action="next"]'));
  $('[data-action="prev"]').click(); await wait(20); $('[data-action="prev"]').click(); await wait(30);
  check('이전 달 두 번 → 9월', $('.cal-title').textContent === '2026년 9월');
  $('[data-action="today"]').click(); await wait(30);
  check('달 이름을 누르면 오늘로', $('.cal-day.selected')?.dataset.date === todayISO && $('[data-action="today"]').classList.contains('cal-title-button'));
  check('달 이름 버튼 읽어주기', $('[data-action="today"]').getAttribute('aria-label').endsWith('누르면 오늘로 이동'));
  check('달 이름 버튼에 초점 유지', doc.activeElement === $('[data-action="today"]'));
  check('360px에서 가로 넘침 없음', doc.documentElement.scrollWidth <= 360, doc.documentElement.scrollWidth);
  check('병사: 일정 추가 버튼', !!$('[data-action="add-event"]'));
  check('병사: 간부 전용 없음', $$('.officer-only').length === 0);
  check('병사: 부대 일정 추가 버튼 없음', !$('[data-action="add-unit-event"]'));
  await load('u01', '#apply'); doc = f.contentDocument;
  check('신청 탭엔 달력 없음', !doc.querySelector('.calendar'));
  await load('o01'); doc = f.contentDocument;
  check('간부도 달력', !!doc.querySelector('.cal-grid') && doc.querySelector('.dday strong').textContent.startsWith('전역까지'));
  check('간부: 부대 일정 추가 버튼', !!doc.querySelector('[data-action="add-unit-event"]'));
} catch (e) { fail++; out.push('ERROR ' + e.stack); }
document.getElementById('result').textContent = `통과 ${pass} / 실패 ${fail}\n` + out.join('\n');
</script>

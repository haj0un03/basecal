<!doctype html><meta charset="utf-8"><body><pre id="result">running</pre>
<iframe id="f" style="width:360px;height:1800px;border:0"></iframe>
<script type="module">
const out = []; let pass = 0, fail = 0;
const check = (name, cond, extra = '') => { cond ? pass++ : fail++; out.push(`${cond ? 'PASS' : 'FAIL'} ${name} ${extra}`); };
const wait = (ms) => new Promise((res) => setTimeout(res, ms));
try {
  // ── 데이터 계층 ──
  localStorage.clear();
  const d = await import('./js/data.js');
  const { mockAuth, mockDb } = await import('./js/mock-data.js');
  const settings = await import('./js/settings.js');
  const codeOf = (id) => mockAuth.find((a) => a.user_id === id).code;
  const as = (name, id) => { d.signOut(); d.signIn(name, codeOf(id)); };
  const reward = () => d.getMyLeaveSummary().find((x) => x.leave_type === 'reward');
  const passes = () => Object.fromEntries(d.getMyPassSummary().map((x) => [x.type, x.remaining]));

  check('설정: 휴가 100·외박 100·외출 50, 한 번 최대 50', JSON.stringify(settings.MERIT_COSTS) === '{"reward":100,"overnight_pass":100,"outing_pass":50}' && settings.MAX_POINTS_PER_ENTRY === 50);
  as('김하늘', 'u01');
  let m = d.getMyMeritSummary();
  check('김하늘 상점 120점(50+50+30-10)', m.balance === 120 && m.available === 120 && m.costs.reward === 100, JSON.stringify({ b: m.balance }));
  check('내역 4건, 최근 것 먼저', m.history.length === 4 && m.history[0].reason === '청소 불량' && m.history[0].points === -10);
  check('포상 외박 0회·외출 1회', JSON.stringify(passes()) === '{"overnight_pass":0,"outing_pass":1}');
  let r = d.requestMeritConversion({ target: 'reward', count: '2' });
  check('포상휴가 2일(200점)은 모자람', r.reason === 'invalid' && r.errors.count.includes('200점') && r.errors.count.includes('120점'), r.errors?.count);
  check('잘못된 대상', !!d.requestMeritConversion({ target: 'annual', count: '1' }).errors?.target);
  check('0 거부', !!d.requestMeritConversion({ target: 'reward', count: '0' }).errors?.count);
  r = d.requestMeritConversion({ target: 'reward', count: '1' }, Date.parse('2026-10-24T03:00:00Z'));
  const conv1 = r.grant;
  check('포상휴가 1일 전환 요청(100점)', r.ok && conv1.leave_type === 'reward' && conv1.days === 1 && conv1.merit_cost === 100 && conv1.reason === '상점 100점 전환');
  m = d.getMyMeritSummary();
  check('100점 묶임, 쓸 수 있는 20점', m.reserved === 100 && m.available === 20);
  check('포상 외출(50점)은 20점으로 불가', !!d.requestMeritConversion({ target: 'outing_pass', count: '1' }).errors?.count);
  check('옛 방식(days만) 요청도 포상휴가로 처리', d.requestMeritConversion({ days: '1' }).errors?.count?.includes('포상휴가'));

  as('백지훈', 'o01');
  let e = d.givePoints({ user_id: 'u02', kind: 'merit', points: '51', reason: 'a' });
  check('한 번에 51점 거부', !!e.errors?.points);
  r = d.givePoints({ user_id: 'u02', kind: 'merit', points: '50', reason: '불침번 성실' });
  check('한 번에 50점 가능', r.ok && r.balance === 80);
  r = d.givePoints({ user_id: 'u02', kind: 'demerit', points: '50', reason: '복장 불량' });
  check('★ 벌점 50인데 상점 80 → 30점', r.ok && r.entry.points === -50 && r.balance === 30);
  r = d.givePoints({ user_id: 'u02', kind: 'demerit', points: '40', reason: '지각' });
  check('★ 상점 30에 벌점 40 → 0점에서 멈춤', r.ok && r.balance === 0 && r.entry.points === -30 && r.entry.given_points === 40, JSON.stringify(r.entry));
  r = d.givePoints({ user_id: 'u02', kind: 'demerit', points: '5', reason: '또 지각' });
  check('0점에 벌점 → 0점 그대로(차감 0, 기록은 남김)', r.ok && r.balance === 0 && r.entry.points === 0 && r.entry.given_points === 5);
  r = d.givePoints({ user_id: 'u02', kind: 'merit', points: '10', reason: '정리' });
  check('그 뒤 상점은 0부터 다시 쌓임', r.balance === 10);
  const pend = d.getPendingLeaveGrants().find((g) => g.id === conv1.id);
  check('승인 대기에 전환 요청(필요 100·현재 120)', pend && pend.merit_cost === 100 && pend.merit_balance === 120);
  d.givePoints({ user_id: 'u01', kind: 'demerit', points: '30', reason: '근무 태만' });
  r = d.decideLeaveGrant(conv1.id, 'approve');
  check('벌점으로 90점이 되면 승인 불가', r.reason === 'not_enough_merit' && r.balance === 90);
  d.givePoints({ user_id: 'u01', kind: 'merit', points: '20', reason: '봉사' });
  r = d.decideLeaveGrant(conv1.id, 'approve', Date.parse('2026-10-24T04:00:00Z'));
  const convRec = mockDb.merit_points.at(-1);
  check('승인 → 100점 차감, 기록 문구', r.ok && convRec.kind === 'conversion' && convRec.points === -100 && convRec.reason === '포상휴가 1일로 전환');
  as('김하늘', 'u01');
  check('상점 10점, 포상휴가 4일', d.getMyMeritSummary().balance === 10 && reward().granted === 4);

  as('박가온', 'u03');
  check('박가온 100점', d.getMyMeritSummary().balance === 100);
  r = d.requestMeritConversion({ target: 'outing_pass', count: '2' });
  check('포상 외출 2회 = 100점 요청', r.ok && r.grant.leave_type === 'outing_pass' && r.grant.days === 2 && r.grant.merit_cost === 100);
  const conv2 = r.grant;
  check('요청만으로는 외출 횟수 그대로', passes().outing_pass === 0);
  as('남궁현', 'o02');
  r = d.decideLeaveGrant(conv2.id, 'approve');
  check('승인 기록 문구: 포상 외출 2회로 전환', r.ok && mockDb.merit_points.at(-1).reason === '포상 외출 2회로 전환');
  as('박가온', 'u03');
  check('포상 외출 2회 생김, 상점 0점', passes().outing_pass === 2 && d.getMyMeritSummary().balance === 0);
  check('포상 외출은 휴가 일수에 안 섞임', d.getMyLeaveSummary().every((x) => x.granted === (x.leave_type === 'annual' ? 24 : 0) || x.leave_type === 'reward'));
  as('백지훈', 'o01');
  d.givePoints({ user_id: 'u03', kind: 'merit', points: '50', reason: 'a' }); d.givePoints({ user_id: 'u03', kind: 'merit', points: '50', reason: 'b' });
  as('박가온', 'u03');
  r = d.requestMeritConversion({ target: 'overnight_pass', count: '1' });
  as('백지훈', 'o01');
  d.decideLeaveGrant(r.grant.id, 'reject');
  as('박가온', 'u03');
  check('포상 외박 반려 → 상점 그대로, 외박 0회', d.getMyMeritSummary().balance === 100 && passes().overnight_pass === 0);
  d.signOut();

  // ── 화면 ──
  const f = document.getElementById('f');
  const loadAs = (id) => new Promise((res) => { localStorage.clear(); localStorage.setItem('basecal.session', JSON.stringify(id)); f.onload = () => setTimeout(res, 300); f.src = `index.html?m=${id}${Math.random()}#apply`; });
  await loadAs('u01');
  let doc = f.contentDocument;
  let $ = (q) => doc.querySelector(q);
  let $$ = (q) => [...doc.querySelectorAll(q)];
  const meritCard = () => $('.leave-card[data-leave-type="merit"]');
  check('상점 카드 120점, 100점=휴가1일', meritCard()?.querySelector('.leave-card-remaining').textContent === '120점' && meritCard().querySelector('.leave-card-detail').textContent === '100점=휴가1일');
  check('포상 외박·외출 횟수 줄', $$('.pass-chip').map((c) => c.textContent).join() === '포상 외박 0회,포상 외출 1회');
  check('카드 4장 한 줄', (() => { const t = $$('.leave-card').map((c) => c.getBoundingClientRect().top); return t.length === 4 && Math.max(...t) - Math.min(...t) < 2; })());
  check('도움말에 100점·50점', $$('.help').some((p) => p.textContent.includes('100점마다 포상휴가 1일 또는 포상 외박 1회, 50점마다 포상 외출 1회')));
  check('받은 요청 목록에 포상 외출 1회', $$('.grant-list:not(.merit-list) .grant-title').some((x) => x.textContent === '포상 외출 1회'));
  $('[data-action="convert-merit"]').click(); await wait(30);
  let fm = $('#leave-dialog form');
  check('전환 창: 세 가지 고르기와 점수', [...fm.querySelectorAll('.choice-stack')].map((c) => c.querySelector('span').textContent + '/' + c.querySelector('small').textContent).join(' | ') === '포상휴가/100점 = 1일 | 포상 외박/100점 = 1회 | 포상 외출/50점 = 1회');
  check('포상휴가: 최대 1일, 미리보기', fm.querySelector('[data-field="count"] .field-label').textContent === '바꿀 일수 (최대 1일)' && fm.querySelector('.conv-preview').textContent === '필요한 상점 100점 · 전환 후 남는 상점 20점');
  fm.querySelector('input[value="outing_pass"]').click(); await wait(20);
  check('포상 외출: 최대 2회', fm.querySelector('[data-field="count"] .field-label').textContent === '바꿀 횟수 (최대 2회)' && fm.querySelector('.conv-preview').textContent === '필요한 상점 50점 · 전환 후 남는 상점 70점');
  fm.elements.count.value = '2'; fm.elements.count.dispatchEvent(new Event('input', { bubbles: true })); await wait(10);
  check('2회 미리보기', fm.querySelector('.conv-preview').textContent === '필요한 상점 100점 · 전환 후 남는 상점 20점');
  fm.elements.count.value = '3'; fm.requestSubmit(); await wait(30);
  check('3회는 모자람 안내', $('[data-error-for="count"]').textContent.includes('150점'));
  fm.elements.count.value = '2'; fm.requestSubmit(); await wait(50);
  check('요청 → 목록 맨 위 대기 포상 외출 2회', !$('#leave-dialog').open && $('.grant-list:not(.merit-list) .grant-item .grant-title').textContent === '포상 외출 2회');
  check('상점 카드: 전환 대기 100', meritCard().querySelector('.leave-card-detail').textContent === '전환 대기 100');
  check('360px 가로 넘침 없음', doc.documentElement.scrollWidth <= 360, doc.documentElement.scrollWidth);
  await loadAs('u02');
  doc = f.contentDocument; $ = (q) => doc.querySelector(q);
  $('[data-action="convert-merit"]').click(); await wait(30);
  check('30점이면 포상휴가 전환 막힘·안내', $('#leave-dialog button[type="submit"]').disabled && $('.conv-preview').textContent.includes('100점 이상'));
  $('#leave-dialog input[value="outing_pass"]').click(); await wait(20);
  check('30점이면 외출도 막힘(50점 필요)', $('#leave-dialog button[type="submit"]').disabled && $('.conv-preview').textContent.includes('50점 이상'));

  await loadAs('o01');
  doc = f.contentDocument; $ = (q) => doc.querySelector(q); $$ = (q) => [...doc.querySelectorAll(q)];
  $('[data-action="give-points"]').click(); await wait(30);
  fm = $('#leave-dialog form');
  check('점수 안내 1~50', fm.querySelector('[data-field="points"] .field-label').textContent === '점수 (1~50)' && fm.elements.points.max === '50');
  check('0점 아래로 안 내려간다는 안내', fm.textContent.includes('0점 아래로 내려가지 않습니다'));
  fm.elements.user_id.value = 'u02'; fm.querySelector('input[value="demerit"]').click(); fm.elements.points.value = '50'; fm.elements.reason.value = '근무지 이탈';
  fm.requestSubmit(); await wait(50);
  $('#user-button').click(); await wait(20);
  [...doc.querySelectorAll('.user-menu-item')].find((b) => b.textContent === '로그아웃').click(); await wait(50);
  const pd = await import('./js/mock-data.js');
  fm = $('.login-form'); fm.elements.name.value = '이바다'; fm.elements.code.value = pd.mockAuth.find((a) => a.user_id === 'u02').code; fm.requestSubmit(); await wait(80);
  f.contentWindow.location.hash = '#apply'; await wait(80);
  check('★ 화면: 상점 30에 벌점 50 → 0점', $('.leave-card[data-leave-type="merit"] .leave-card-remaining').textContent === '0점');
  check('내역: 벌점 -30, 50점 중 30점만 차감 안내', $('.merit-list .merit-badge').textContent === '벌점 -30' && $('.merit-list .grant-meta').textContent.includes('벌점 50점 중 30점만 차감'));
} catch (err) { fail++; out.push('ERROR ' + err.stack); }
document.getElementById('result').textContent = `통과 ${pass} / 실패 ${fail}\n` + out.join('\n');
</script>

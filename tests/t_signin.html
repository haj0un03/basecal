<!doctype html><meta charset="utf-8"><body><pre id="result">running</pre>
<iframe id="f" style="width:360px;height:900px"></iframe>
<script type="module">
const out = []; let pass = 0, fail = 0;
const check = (name, cond, extra = '') => { cond ? pass++ : fail++; out.push(`${cond ? 'PASS' : 'FAIL'} ${name} ${extra}`); };
const wait = (ms) => new Promise((res) => setTimeout(res, ms));
try {
  localStorage.clear();
  const d = await import('./js/data.js');
  const { mockAuth, mockDb } = await import('./js/mock-data.js');
  const codeOf = (id) => mockAuth.find((a) => a.user_id === id).code;
  const t0 = Date.now();

  // ── 코드 규칙 ──
  check('가상 인원 22명 모두 코드', mockAuth.length === 22 && mockDb.profiles.length === 22);
  check('코드 서로 다름', new Set(mockAuth.map((a) => a.code)).size === 22);
  check('코드 형식(헷갈리는 글자 없음)', mockAuth.every((a) => /^[A-HJKMNP-Z2-9]{6}$/.test(a.code)));
  check('invite_codes 표 없음', !('invite_codes' in mockDb));
  check('profiles에 아이디·소속 없고 보직 있음', mockDb.profiles.every((p) => !('username' in p) && !('company' in p) && p.position));
  check('normalizeCode', d.normalizeCode(' ab3 - k7m ') === 'AB3K7M');
  check('형식 오류(0 포함)', d.signIn('김하늘', 'ABC0EF', t0).reason === 'format');
  check('형식 오류(5자리)', d.signIn('김하늘', 'ABCDE', t0).reason === 'format');
  check('형식 오류는 실패 횟수에 안 셈', d.signIn('김하늘', codeOf('u01'), t0).ok); d.signOut();

  // ── 들어오기 ──
  const c1 = codeOf('u01');
  check('이름+코드로 들어오기', d.signIn('김하늘', c1, t0).ok && d.getCurrentUser().id === 'u01'); d.signOut();
  check('소문자·띄어쓰기 허용', d.signIn(' 김하늘 ', `${c1.slice(0, 3).toLowerCase()} ${c1.slice(3).toLowerCase()}`, t0).ok); d.signOut();
  check('다른 사람 코드로는 불가', d.signIn('김하늘', codeOf('u02'), t0).reason === 'invalid');
  check('간부 들어오기', d.signIn('백지훈', codeOf('o01'), t0).ok && d.getCurrentUser().role === 'officer'); d.signOut();
  // 같은 이름 두 명
  mockDb.profiles.push({ id: 'u99', name: '김하늘', role: 'soldier', position: '취사병', enlist_date: '2026-01-01', discharge_date: '2027-06-30', is_active: true });
  mockAuth.push({ user_id: 'u99', code: 'ZZZ222' });
  check('같은 이름: 첫째 코드 → 소총수', d.signIn('김하늘', c1, t0).ok && d.getCurrentUser().position === '소총수'); d.signOut();
  check('같은 이름: 둘째 코드 → 취사병', d.signIn('김하늘', 'zzz222', t0).ok && d.getCurrentUser().position === '취사병'); d.signOut();
  mockDb.profiles.pop(); mockAuth.pop();

  // ── 잠금 ──
  let r;
  for (let i = 1; i <= 4; i++) { r = d.signIn('박가온', 'AAAAAA', t0); check(`틀림 ${i}회 → 남은 ${5 - i}`, r.reason === 'invalid' && r.remainingAttempts === 5 - i); }
  r = d.signIn('박가온', 'AAAAAA', t0); check('5회째 잠김', r.reason === 'locked');
  check('잠긴 동안 맞는 코드도 거부', d.signIn('박가온', codeOf('u03'), t0 + 60000).reason === 'locked');
  check('다른 이름은 영향 없음', d.signIn('최나래', codeOf('u04'), t0 + 60000).ok); d.signOut();
  check('10분 지나면 들어옴', d.signIn('박가온', codeOf('u03'), t0 + 600001).ok); d.signOut();
  d.signIn('정다온', 'AAAAAA', t0); d.signIn('정다온', codeOf('u05'), t0); d.signOut();
  check('성공하면 실패 횟수 초기화', d.signIn('정다온', 'AAAAAA', t0).remainingAttempts === 4);

  // ── 화면 ──
  localStorage.clear();
  const f = document.getElementById('f');
  let n = 0;
  const load = (hash = '') => new Promise((res) => { f.onload = () => setTimeout(res, 300); f.src = `index.html?r=${++n}${hash}`; });
  await load();
  let w = f.contentWindow, doc = f.contentDocument;
  const $ = (s) => doc.querySelector(s);
  check('처음엔 들어오기 화면', $('h1').textContent === '들어오기');
  check('들어오기 전엔 위에 앱 이름', $('.topbar .app-title')?.textContent === '부대 달력');
  check('탭·사용자 버튼 숨김', w.getComputedStyle($('.tabbar')).display === 'none' && w.getComputedStyle($('.user-area')).display === 'none');
  check('아이디·비밀번호 칸 없음', !$('input[name="username"]') && !$('input[type="password"]'));
  check('가입 버튼 없음', !$('[data-action="register"]'));
  check('연습용 코드 표 22줄', doc.querySelectorAll('.demo-table tbody tr').length === 22);
  let fm = $('.login-form');
  fm.requestSubmit(); await wait(30);
  check('빈칸 안내', $('.form-error').textContent.includes('입력하세요'));
  fm.elements.name.value = '김하늘'; fm.elements.code.value = 'ABC0EF'; fm.requestSubmit(); await wait(30);
  check('형식 안내', $('.form-error').textContent.includes('6자리'));
  fm.elements.code.value = 'AAAAAA'; fm.requestSubmit(); await wait(30);
  check('틀리면 남은 횟수', $('.form-error').textContent.includes('남은 시도 4회'), $('.form-error').textContent);
  check('틀리면 코드 칸 비움', fm.elements.code.value === '');
  fm.elements.code.value = c1.toLowerCase(); fm.requestSubmit(); await wait(100);
  check('들어오면 달력', $('h1').textContent === '달력' && w.location.hash === '#calendar');
  check('화면 위에 이름·보직', $('.topbar-name').textContent === '김하늘' && $('.topbar-sub').textContent === '소총수');
  check('메뉴 버튼은 ⋮, 읽어주기는 사용자 메뉴', $('#user-button').textContent === '⋮' && $('#user-button').getAttribute('aria-label') === '사용자 메뉴');
  check('앱 이름 자리에 이름', !$('.topbar .app-title'));
  await load('#apply'); w = f.contentWindow; doc = f.contentDocument;
  check('새로고침해도 유지', doc.querySelector('h1').textContent === '신청');
  doc.getElementById('user-button').click(); await wait(30);
  const items = [...doc.querySelectorAll('.user-menu-item')].map((b) => b.textContent);
  check('병사 메뉴는 로그아웃만', JSON.stringify(items) === '["로그아웃"]', JSON.stringify(items));
  doc.querySelector('.user-menu-item').click(); await wait(100);
  check('로그아웃하면 들어오기 화면', doc.querySelector('h1').textContent === '들어오기');
  check('로그아웃하면 위에 다시 앱 이름', doc.querySelector('.topbar .app-title')?.textContent === '부대 달력' && !doc.querySelector('.topbar-name'));
  await load(); doc = f.contentDocument;
  check('로그아웃 후 새로고침해도 들어오기 화면', doc.querySelector('h1').textContent === '들어오기');
  fm = doc.querySelector('.login-form');
  for (let i = 0; i < 5; i++) { fm.elements.name.value = '장한결'; fm.elements.code.value = 'BBBBBB'; fm.requestSubmit(); await wait(30); }
  check('5회 틀리면 잠금 안내', doc.querySelector('.form-error').textContent.includes('10분'), doc.querySelector('.form-error').textContent);
} catch (e) { fail++; out.push('ERROR ' + e.stack); }
document.getElementById('result').textContent = `통과 ${pass} / 실패 ${fail}\n` + out.join('\n');
</script>

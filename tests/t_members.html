<!doctype html><meta charset="utf-8"><body><pre id="result">running</pre>
<iframe id="f" style="width:360px;height:900px"></iframe>
<script type="module">
const out = []; let pass = 0, fail = 0;
const check = (name, cond, extra = '') => { cond ? pass++ : fail++; out.push(`${cond ? 'PASS' : 'FAIL'} ${name} ${extra}`); };
const wait = (ms) => new Promise((res) => setTimeout(res, ms));
try {
  // ── 데이터 계층 ──
  localStorage.clear();
  const d = await import('./js/data.js');
  const { mockAuth, mockDb } = await import('./js/mock-data.js');
  const codeOf = (id) => mockAuth.find((a) => a.user_id === id).code;
  const now = Date.now();
  const base = { name: '새병사', role: 'soldier', position: '운전병', enlist_date: '2026-09-01', discharge_date: '2028-02-29' };

  check('로그아웃 상태 추가 불가', d.addMember(base, now).reason === 'forbidden');
  d.signIn('김하늘', codeOf('u01'));
  check('병사 추가 불가', d.addMember(base, now).reason === 'forbidden');
  check('병사 다시 발급 불가', d.reissueCode('u02', now).reason === 'forbidden');
  check('병사는 인원 목록 못 봄', d.getMembers().length === 0);
  d.signOut();
  d.signIn('백지훈', codeOf('o01'));
  check('간부 인원 목록 22명', d.getMembers().length === 22);
  const e = d.addMember({ name: ' ', role: 'x', position: '  ', enlist_date: '', discharge_date: '' }, now);
  check('입력 오류 5개', e.reason === 'invalid' && ['name', 'role', 'position', 'enlist_date', 'discharge_date'].every((k) => e.errors[k]), JSON.stringify(e.errors));
  check('전역일이 입대일보다 앞', !!d.addMember({ ...base, discharge_date: '2026-08-01' }, now).errors?.discharge_date);
  check('오류면 인원 안 늘어남', mockDb.profiles.length === 22);
  const r = d.addMember(base, now);
  check('추가 성공', r.ok && r.user.id === 'u21' && r.user.position === '운전병', JSON.stringify(r.user));
  check('보직 21자 거부', !!d.addMember({ ...base, position: '가'.repeat(21) }, now).errors?.position);
  const sp = d.addMember({ ...base, name: '띄어쓰기', position: '  운전   병 ' }, now);
  check('보직 공백 정리', sp.ok && sp.user.position === '운전 병', sp.user?.position);
  mockDb.profiles.pop(); mockAuth.pop(); mockDb.audit_logs.pop();
  check('보직 추천 목록', JSON.stringify(d.getPositions()).includes('운전병') && d.getPositions().length === new Set(d.getPositions()).size, JSON.stringify(d.getPositions()));
  check('코드 형식', /^[A-HJKMNP-Z2-9]{6}$/.test(r.code), r.code);
  check('코드 중복 없음', new Set(mockAuth.map((a) => a.code)).size === mockAuth.length);
  check('기록 남음(issue_code)', mockDb.audit_logs.at(-1).action === 'issue_code' && mockDb.audit_logs.at(-1).actor_id === 'o01' && mockDb.audit_logs.at(-1).target_id === 'u21');
  check('추가해도 간부는 그대로 들어와 있음', d.getCurrentUser().id === 'o01');
  const o = d.addMember({ ...base, name: '새간부', role: 'officer', position: '소대장' }, now);
  check('간부 추가', o.ok && o.user.id === 'o03' && o.user.role === 'officer');
  d.signOut();
  check('새 인원으로 들어오기', d.signIn('새병사', r.code.toLowerCase()).ok && d.getCurrentUser().id === 'u21');
  d.signOut();
  d.signIn('백지훈', codeOf('o01'));
  const old = codeOf('u02');
  const re = d.reissueCode('u02', now);
  check('다시 발급 성공', re.ok && re.code !== old && /^[A-HJKMNP-Z2-9]{6}$/.test(re.code));
  check('기록 남음(reissue_code)', mockDb.audit_logs.at(-1).action === 'reissue_code' && mockDb.audit_logs.at(-1).target_id === 'u02');
  check('없는 대상', d.reissueCode('u999', now).reason === 'not_found');
  d.signOut();
  check('이전 코드 거부', d.signIn('이바다', old).reason === 'invalid');
  check('새 코드로 들어옴', d.signIn('이바다', re.code).ok);
  d.signOut();

  // ── 화면 ──
  localStorage.clear(); localStorage.setItem('basecal.session', '"o01"');
  const f = document.getElementById('f');
  await new Promise((res) => { f.onload = () => setTimeout(res, 300); f.src = 'index.html?ui=1'; });
  const doc = f.contentDocument;
  const $ = (s) => doc.querySelector(s);
  const menuClick = async (label) => {
    $('#user-button').click(); await wait(30);
    [...doc.querySelectorAll('.user-menu-item')].find((b) => b.textContent === label).click(); await wait(50);
  };
  await menuClick('인원 추가·코드 발급');
  check('추가 창 열림', $('#member-dialog').open);
  let fm = $('#member-dialog form');
  check('보직 추천 목록 있음', fm.querySelector('#position-options').options.length >= 10, fm.querySelector('#position-options').options.length);
  fm.requestSubmit(); await wait(30);
  check('빈칸 항목별 오류', !$('[data-error-for="name"]').hidden && !$('[data-error-for="position"]').hidden && !$('[data-error-for="enlist_date"]').hidden);
  fm.elements.name.value = '화면병사'; fm.elements.position.value = '통신병';
  fm.elements.enlist_date.value = '2026-09-01'; fm.elements.discharge_date.value = '2028-02-29';
  fm.requestSubmit(); await wait(50);
  const shown = $('.issued-code').textContent;
  check('코드 3자리씩 표시', /^[A-HJKMNP-Z2-9]{3} [A-HJKMNP-Z2-9]{3}$/.test(shown), shown);
  check('대상 표시', $('.issued-target').textContent === '화면병사 · 통신병 · 병사', $('.issued-target').textContent);
  $('#member-dialog [data-action="close"]').click(); await wait(50);
  check('창 닫힘', !$('#member-dialog').open);
  await menuClick('코드 다시 발급');
  const sel = $('#member-dialog select');
  check('다시 발급 목록에 새 인원 포함', [...sel.options].some((o) => o.textContent === '화면병사 · 통신병 (병사)'), sel.options.length);
  sel.value = [...sel.options].find((o) => o.textContent === '화면병사 · 통신병 (병사)').value;
  $('#member-dialog form').requestSubmit(); await wait(50);
  const newShown = $('.issued-code').textContent;
  check('다시 발급 결과', newShown !== shown && $('#member-dialog h2').textContent === '코드를 다시 발급했습니다', newShown);
  $('#member-dialog [data-action="close"]').click(); await wait(50);
  await menuClick('로그아웃');
  fm = $('.login-form');
  fm.elements.name.value = '화면병사'; fm.elements.code.value = shown; fm.requestSubmit(); await wait(50);
  check('이전 코드로는 못 들어옴(화면)', $('.form-error').textContent.includes('맞지 않습니다'), JSON.stringify({h1: $('h1').textContent, err: $('.form-error')?.textContent, hidden: $('.form-error')?.hidden, open: $('#member-dialog').open}));
  fm.elements.code.value = newShown.toLowerCase(); fm.requestSubmit(); await wait(100);
  check('새 코드로 들어옴(화면)', $('h1').textContent === '달력' && $('.topbar-name').textContent === '화면병사');
} catch (err) { fail++; out.push('ERROR ' + err.stack); }
document.getElementById('result').textContent = `통과 ${pass} / 실패 ${fail}\n` + out.join('\n');
</script>

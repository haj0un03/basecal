  check('★ 예약이 있는 시간은 막을 수 없음 (먼저 반려)', !r.ok && r.errors.time.includes('먼저 반려') && r.errors.time.includes('박가온'));

  }
  // 취소
  f.contentWindow.confirm = () => true;
  $('.fac-my-list .danger').click(); await wait(50);
  check('★ 화면: 예약 취소 → "취소"', $('.fac-my-list .status-badge').textContent === '취소');
  check('360px 가로 넘침 없음 (병사)', f.contentDocument.documentElement.scrollWidth <= 360);
  // 출타 중인 날
  await open('u05', '#apply/facility');
  if ('2026-11-12' >= rw.start && '2026-11-12' <= rw.end) {
    const c12 = $('.fac-cal-day[data-date="2026-11-12"]');
    check('출타 날 달력 칸: "출타"', c12.querySelector('.fac-cal-tag').textContent === '출타');
    c12.click(); await wait(40);
    $('.fac-cell[data-facility="f02"]').click(); await wait(40);
    $$('.fac-slot.state-free')[0]?.click(); await wait(30);
    check('★ 출타 날: 안내 + 신청 버튼 막힘', $('.fac-warn').textContent.includes('출타 중') && $('[data-action="reserve"]').disabled);
  }

  // 간부: 승인 대기·반려·시설 막기
  await open('o01', '#apply/facility');
  f.contentWindow.confirm = () => true;
  f.contentWindow.alert = (m) => out.push('ALERT ' + m);
  const dlg = $('#facility-dialog');
  check('★ 간부: 승인 대기 목록이 맨 위', $('.facility-section h3').textContent === '승인 대기' && $$('.fac-pending-list .fac-item').length === 2);
  check('대기 목록: 신청자 이름과 신청 시각', /최나래 · \d+\/\d+ \d\d:\d\d 신청/.test($('.fac-pending-list .fac-item').textContent), $('.fac-pending-list .fac-item').textContent);
  $('.fac-pending-list .approve').click(); await wait(60);
  check('★ 화면: 승인하면 목록에서 빠짐', $$('.fac-pending-list .fac-item').length === 1);
  $('.fac-pending-list .danger').click(); await wait(40);
  check('반려 창 열림', dlg.open);
  dlg.querySelector('form').requestSubmit(); await wait(40);
  check('반려 사유 없으면 안내', dlg.open && !dlg.querySelector('[data-error-for="reject_reason"]').hidden);
  dlg.querySelector('[name="reject_reason"]').value = '행사';
  dlg.querySelector('form').requestSubmit(); await wait(60);
  check('★ 화면: 반려 → 대기 없음', !dlg.open && !$('.fac-pending-list') && $('.facility-section').textContent.includes('승인 대기 중인 예약이 없습니다'));
  check('간부: 시설 막기 목록', $$('.fac-block-list .grant-item').length === fd.getFacilityBlocks().length);
  $('[data-action="add-block"]').click(); await wait(40);
  const bf = dlg.querySelector('form');
  check('막기 창: 시설 목록에 "모든 시설" + 7곳', bf.elements.facility_id.options.length === 8 && bf.elements.facility_id.options[0].textContent === '모든 시설');
  bf.querySelector('input[value="time"]').click(); await wait(20);
  check('시간 정하기를 고르면 시간 칸', !dlg.querySelector('.fac-block-times').hidden);
  bf.elements.facility_id.value = 'f05';
  bf.elements.date.value = addDays(rw.start, 3);
  bf.elements.start_time.value = '18:00';
  bf.elements.end_time.value = '20:00';
  bf.elements.reason.value = '조명 수리';
  bf.requestSubmit(); await wait(60);
  check('★ 화면: 막기 추가', !dlg.open && $$('.fac-block-list .grant-item').some((x) => x.textContent.includes('풋살장(이정란관) 18:00~20:00') && x.textContent.includes('조명 수리')));
  const blkItem = $$('.fac-block-list .grant-item').find((x) => x.textContent.includes('조명 수리'));
  blkItem.querySelector('.danger').click(); await wait(50);
  check('★ 화면: 풀기', !$$('.fac-block-list .grant-item').some((x) => x.textContent.includes('조명 수리')));
  check('360px 가로 넘침 없음 (간부)', f.contentDocument.documentElement.scrollWidth <= 360);
} catch (err) { fail++; out.push('ERROR ' + err.stack); }
document.getElementById('result').textContent = `통과 ${pass} / 실패 ${fail}\n` + out.join('\n');
</script>

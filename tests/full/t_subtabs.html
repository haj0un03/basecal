<!doctype html><meta charset="utf-8"><body><pre id="result">running</pre>
<iframe id="f" style="width:360px;height:700px;border:0"></iframe>
<script type="module">
// 신청 탭 위쪽 탭 (휴가 | 근무 | 시설), 2026-11-07
const out = []; let pass = 0, fail = 0;
const check = (name, cond, extra = '') => { cond ? pass++ : fail++; out.push(`${cond ? 'PASS' : 'FAIL'} ${name} ${extra}`); };
const wait = (ms) => new Promise((res) => setTimeout(res, ms));
try {
  const f = document.getElementById('f');
  const open = (id, hash) => new Promise((res) => { localStorage.clear(); localStorage.setItem('basecal.session', `"${id}"`); f.onload = () => setTimeout(res, 300); f.src = `index.html?s=${Math.random()}${hash}`; });
  const $ = (q) => f.contentDocument.querySelector(q);
  const $$ = (q) => [...f.contentDocument.querySelectorAll(q)];
  const current = () => $('.subtab[aria-current="page"]')?.textContent;
  const h2s = () => $$('.view h2').map((h) => h.textContent).join();

  await open('u01', '#apply');
  const w = f.contentWindow;
  check('★ 병사 위쪽 탭 3개: 휴가·근무 교대·시설', $$('.subtab').map((x) => x.textContent).join() === '휴가,근무 교대,시설');
  check('위쪽 탭 이름표 "신청 메뉴"', $('.subtabs').getAttribute('aria-label') === '신청 메뉴');
  check('★ #apply는 휴가 탭', current() === '휴가' && h2s() === '휴가' && !!$('.leave-section') && !$('.duty-section'));
  check('휴가 탭에 정식 승인 안내', $('.leave-section').textContent.includes('기존 부대'));
  check('하단 탭은 그대로 2개', $$('.tab').map((x) => x.textContent).join() === '달력,신청');
  check('영역 제목은 화면에서 숨김 (읽어주기용)', $('.leave-section h2').getBoundingClientRect().width <= 1);

  $('.subtab[data-panel="duty"]').focus();
  $('.subtab[data-panel="duty"]').click(); await wait(80);
  check('★ 근무 탭을 누르면 근무 영역만', w.location.hash === '#apply/duty' && current() === '근무 교대' && h2s() === '근무 교대' && !!$('.duty-cal') && !$('.leave-section'));
  check('누른 탭에 초점 유지', f.contentDocument.activeElement === $('.subtab[data-panel="duty"]'));
  $('.subtab[data-panel="facility"]').click(); await wait(80);
  check('★ 시설 탭', current() === '시설' && h2s() === '시설' && !!$('.fac-cal'));

  // 하단 "신청"은 마지막으로 본 영역으로
  w.location.hash = '#calendar'; await wait(80);
  check('달력 탭에서는 위쪽 탭 없음', !$('.subtabs'));
  check('★ 하단 신청 탭 주소 = 마지막으로 본 영역', $('.tab[data-tab="apply"]').getAttribute('href') === '#apply/facility');
  $('.tab[data-tab="apply"]').click(); await wait(80);
  check('하단 신청 탭 → 시설 탭으로 돌아옴', current() === '시설');

  // 새로고침해도 그 탭
  await new Promise((res) => { f.onload = () => setTimeout(res, 300); f.contentWindow.location.reload(); });
  check('★ 새로고침해도 시설 탭', current() === '시설');

  // 예전 주소, 이상한 주소
  await open('u01', '#facility');
  check('예전 주소 #facility → 시설 탭', current() === '시설');
  await open('u01', '#leave');
  check('예전 주소 #leave → 휴가 탭', current() === '휴가');
  await open('u01', '#apply/zzz');
  check('없는 영역 → 휴가 탭', current() === '휴가');

  // 탭을 바꾸면 맨 위부터
  await open('u01', '#apply/leave');
  f.contentWindow.scrollTo(0, 1200); await wait(50);
  const sticky = $('.subtabs').getBoundingClientRect().top;
  check('내려도 위쪽 탭이 화면 위에 붙어 있음', sticky >= 0 && sticky <= 60, sticky);
  $('.subtab[data-panel="duty"]').click(); await wait(80);
  check('★ 탭을 바꾸면 맨 위부터 보임', f.contentWindow.scrollY === 0, f.contentWindow.scrollY);
  check('360px 가로 넘침 없음 (병사)', f.contentDocument.documentElement.scrollWidth <= 360);

  // 간부
  await open('o01', '#apply/duty');
  check('★ 간부 위쪽 탭은 근무', $$('.subtab').map((x) => x.textContent).join() === '휴가,근무,시설');
  check('간부: 근무 탭에 근무지 관리', current() === '근무' && !!$('[data-action="add-duty-post"]'));
  $('.subtab[data-panel="leave"]').click(); await wait(80);
  check('간부: 휴가 탭에 출타 현황', !!$('.roster-box') && !$('[data-action="add-duty-post"]'));
  $('.subtab[data-panel="facility"]').click(); await wait(80);
  check('간부: 시설 탭에 승인 대기·시설 막기', !!$('.fac-pending-head') && !!$('[data-action="add-block"]'));
  check('360px 가로 넘침 없음 (간부)', f.contentDocument.documentElement.scrollWidth <= 360);
} catch (err) { fail++; out.push('ERROR ' + err.stack); }
document.getElementById('result').textContent = `통과 ${pass} / 실패 ${fail}\n` + out.join('\n');
</script>

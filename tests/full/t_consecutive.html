<!doctype html><meta charset="utf-8"><body><pre id="result">running</pre>
<iframe id="f" style="width:360px;height:2400px;border:0"></iframe>
<script type="module">
// 연속 근무 주의 (2026-11-07): 이틀 연달아 근무하는 병사를 간부에게 알림 (막지 않음)
const out = []; let pass = 0, fail = 0;
const check = (name, cond, extra = '') => { cond ? pass++ : fail++; out.push(`${cond ? 'PASS' : 'FAIL'} ${name} ${extra}`); };
const wait = (ms) => new Promise((res) => setTimeout(res, ms));
const addDays = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); const x = new Date(y, m - 1, d + n); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
try {
  localStorage.clear();
  const d = await import('./js/data.js');
  const { mockAuth, mockDb } = await import('./js/mock-data.js');
  const codeOf = (id) => mockAuth.find((a) => a.user_id === id).code;
  const as = (id) => { d.signOut(); d.signIn(mockDb.profiles.find((p) => p.id === id).name, codeOf(id)); };
  const win = d.getApplyWindow();
  // 기대값: 근무표에서 직접 날짜별 근무자를 모아 연속 구간을 센다
  const expected = () => {
    const by = new Map();
    for (let x = addDays(win.start, -1); x <= win.end; x = addDays(x, 1)) {
      d.getDutyBoard(x).forEach((p) => p.slots.forEach((s) => { if (s.user_id) { if (!by.has(s.user_id)) by.set(s.user_id, {}); const m = by.get(s.user_id); m[x] = (m[x] ?? false) || s.source === 'swap'; } }));
    }
    const runs = [];
    by.forEach((m, id) => {
      const u = Object.keys(m).sort();
      let st = u[0];
      u.forEach((x, i) => { if (u[i + 1] !== addDays(x, 1) || m[x] || m[u[i + 1]]) { if (st !== x && x >= win.start) runs.push(`${id}:${st}:${x}`); st = u[i + 1]; } });
    });
    return runs.sort();
  };
  const got = () => d.getConsecutiveDuties().map((x) => `${x.user_id}:${x.start}:${x.end}`).sort();

  as('u01');
  check('병사는 연속 근무 목록 못 받음', d.getConsecutiveDuties().length === 0);
  as('o01');
  check('★ 지금 연속 근무 목록 = 근무표로 직접 센 것', got().join() === expected().join(), got().join());
  // 연속 근무를 일부러 만든다: D날 근무한 X를 D+1날 근무에 넣기
  let X = null, D = null, slotNext = null;
  for (let x = addDays(win.start, 1); x < addDays(win.end, -2) && !X; x = addDays(x, 1)) {
    const today = d.getDutyBoard(x)[0].slots.map((s) => s.user_id);
    const next = d.getDutyBoard(addDays(x, 1))[0];
    const cands = d.getDutyCandidates(next.post_id, addDays(x, 1), 0);
    const pick = cands.find((c) => today.includes(c.id) && !c.blocked && !c.current);
    if (pick) { X = pick; D = x; slotNext = next.post_id; }
  }
  check('점검 준비: 연속이 될 병사 찾음', !!X, `${X?.id} ${D}`);
  check('★ 손 수정 창 후보: 넣으면 연속이면 consecutive 표시', X.consecutive === true);
  const before = got().length;
  const r = d.setDutyOverride({ post_id: slotNext, date: addDays(D, 1), slot: 0, user_id: X.id });
  check('연속이어도 막지 않음 (손 수정 됨)', r.ok, JSON.stringify(r));
  const item = d.getConsecutiveDuties().find((x) => x.user_id === X.id && x.start <= D && x.end >= addDays(D, 1));
  check('★ 손 수정 뒤 연속 근무 목록에 나타남', !!item && got().length === before + 1 && item.days >= 2 && item.name === X.name, JSON.stringify(item));
  check('목록 = 근무표로 직접 센 것 (수정 뒤)', got().join() === expected().join());
  d.clearDutyOverride({ post_id: slotNext, date: addDays(D, 1), slot: 0 });
  check('되돌리면 사라짐', got().length === before);

  // 교대로 생긴 연속 근무는 병사끼리 합의한 것이라 알리지 않는다 (11/7 사용자 결정)
  as(X.id);
  const myD = d.getMyDuties(D, D)[0];
  // X의 D날 근무를, D-1 또는 D+1에 근무가 있는 병사가 대신 서도록 (승인하면 그 병사는 이틀 연속)
  const partner = d.getSwapChoices(myD).find((p) => {
    const ds = d.getSoldierDuties(p.id).map((x) => x.date);
    return ds.includes(addDays(D, 1)) || ds.includes(addDays(D, -1));
  });
  check('점검 준비: 교대로 연속이 될 상대 찾음', !!partner);
  const req = d.requestDutySwap({ kind: 'cover', requester_duty: { post_id: myD.post_id, date: myD.date, slot: myD.slot }, partner_id: partner.id, reason: '면회' });
  as('o01');
  const w = d.getDutySwaps().find((x) => x.id === req.swap.id);
  check('★ 교대 승인 대기에는 연속 근무 경고 없음', !('consecutive' in w) && w.problem === null);
  const beforeSwap = got().join();
  check('승인', d.decideDutySwap(req.swap.id, 'approve').ok);
  const pdates = d.getDutyBoard(D).flatMap((p) => p.slots).filter((x) => x.user_id === partner.id);
  check('(상대가 D날 교대로 근무, 옆날도 근무)', pdates.length === 1 && pdates[0].source === 'swap');
  check('★ 교대로 생긴 연속 근무는 목록에 없음', !d.getConsecutiveDuties().some((x) => x.user_id === partner.id && x.start <= D && x.end >= D) && got().join() === expected().join(), got().join());
  // 교대로 받은 날 옆에 간부가 손 수정으로 넣을 때도 그 날은 세지 않는다
  const around = [addDays(D, -1), addDays(D, 1)].find((x) => !d.getDutyBoard(x).flatMap((p) => p.slots).some((s) => s.user_id === partner.id));
  if (around) {
    const c = d.getDutyCandidates(d.getDutyBoard(around)[0].post_id, around, 0).find((x) => x.id === partner.id);
    // around의 반대쪽 옆날(D가 아닌 쪽)에 교대가 아닌 근무가 있을 때만 연속
    const other = around < D ? addDays(around, -1) : addDays(around, 1);
    const otherDuty = d.getDutyBoard(other).flatMap((p) => p.slots).some((s) => s.user_id === partner.id && s.source !== 'swap');
    check('손 수정 창: 교대로 받은 근무 옆날은 연속으로 안 셈 (반대쪽 옆날만 봄)', !c || c.blocked || c.consecutive === otherDuty, JSON.stringify({ c, other, otherDuty }));
  }
  d.signOut();

  // ── 화면 ──
  const f = document.getElementById('f');
  const open = (id, hash) => new Promise((res) => { localStorage.clear(); localStorage.setItem('basecal.session', `"${id}"`); f.onload = () => setTimeout(res, 300); f.src = `index.html?c=${Math.random()}${hash}`; });
  const $ = (q) => f.contentDocument.querySelector(q);
  const $$ = (q) => [...f.contentDocument.querySelectorAll(q)];
  await open('u01', '#apply/duty');
  check('병사 화면에는 연속 근무 주의 없음', !$('.duty-consecutive-list') && !f.contentDocument.body.textContent.includes('연속 근무 주의'));
  await open('o01', '#apply/duty');
  const fd = await f.contentWindow.Function('return import("./js/data.js")')();
  const heads = $$('.duty-section h3').map((h) => h.textContent);
  check('★ 간부 근무 탭: 교대 요청 → 연속 근무 주의 → 근무표 순서', heads.indexOf('연속 근무 주의') > heads.indexOf('교대 요청') && heads.indexOf('근무표') > heads.indexOf('연속 근무 주의'), heads.join());
  const n0 = $$('.duty-consecutive-item').length;
  check('처음 목록 개수 = 데이터', n0 === fd.getConsecutiveDuties().length);
  // 화면에서 손 수정으로 연속 근무를 만든다
  const nextDay = addDays(win.start, 1);
  const todayIds = fd.getDutyBoard(win.start)[0].slots.map((s) => s.user_id);
  const nb = fd.getDutyBoard(nextDay)[0];
  const cand = fd.getDutyCandidates(nb.post_id, nextDay, 0).find((c) => todayIds.includes(c.id) && !c.blocked && !c.current);
  if (cand) {
    $('[data-action="duty-next"]').click(); await wait(40);
    $('[data-override$=":0"]').click(); await wait(40);
    const opt = [...$('#duty-dialog select').options].find((o) => o.value === cand.id);
    check('★ 손 수정 창: "연속 근무 주의" 표시, 고를 수는 있음', opt.textContent.includes('연속 근무 주의') && !opt.disabled);
    $('#duty-dialog select').value = cand.id;
    $('#duty-dialog form').requestSubmit(); await wait(60);
    check('★ 화면: 바꾸면 연속 근무 주의 목록에 나타남', $$('.duty-consecutive-item').length === n0 + 1 && $$('.duty-consecutive-item').some((x) => x.textContent.includes(cand.name)));
    const it = $$('.duty-consecutive-item').find((x) => x.textContent.includes(cand.name));
    $('[data-action="duty-today"]')?.click(); await wait(40);
    $$('.duty-consecutive-item').find((x) => x.textContent.includes(cand.name)).click(); await wait(40);
    const [, startIso] = it.dataset.consecutive.split(':');
    check('목록을 누르면 근무표가 그날로', $('.duty-date').textContent.startsWith(`${Number(startIso.slice(5, 7))}/${Number(startIso.slice(8))}`));
  } else {
    check('(화면 손 수정 점검: 맞는 병사 없음 — 건너뜀)', true);
  }
  check('360px 가로 넘침 없음 (간부)', f.contentDocument.documentElement.scrollWidth <= 360);
} catch (err) { fail++; out.push('ERROR ' + err.stack); }
document.getElementById('result').textContent = `통과 ${pass} / 실패 ${fail}\n` + out.join('\n');
</script>

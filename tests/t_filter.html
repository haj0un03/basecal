<!doctype html><meta charset="utf-8"><body><pre id="result">running</pre>
<iframe id="f" style="width:360px;height:1300px;border:0"></iframe>
<script type="module">
const out = []; let pass = 0, fail = 0;
const check = (name, cond, extra = '') => { cond ? pass++ : fail++; out.push(`${cond ? 'PASS' : 'FAIL'} ${name} ${extra}`); };
const wait = (ms) => new Promise((res) => setTimeout(res, ms));
try {
  localStorage.clear(); localStorage.setItem('basecal.session', '"u01"');
  const f = document.getElementById('f');
  await new Promise((res) => { f.onload = () => setTimeout(res, 300); f.src = 'index.html?fl=1#calendar'; });
  const doc = f.contentDocument, w = f.contentWindow;
  const $ = (s) => doc.querySelector(s);
  const $$ = (s) => [...doc.querySelectorAll(s)];
  const goTo = async (y, m) => {
    for (let i = 0; i < 24; i++) {
      const [cy, cm] = $('.cal-title').textContent.match(/\d+/g).map(Number);
      if (cy === y && cm === m) return;
      $(`[data-action="${cy * 12 + cm < y * 12 + m ? 'next' : 'prev'}"]`).click(); await wait(20);
    }
  };
  const add = async (kind, title, start, end = '') => {
    $('[data-action="add-event"]').click(); await wait(20);
    const fm = $('#event-dialog form');
    fm.querySelector(`input[value="${kind}"]`)?.click();
    fm.elements.title.value = title; fm.elements.start_date.value = start; fm.elements.end_date.value = end;
    fm.requestSubmit(); await wait(40);
  };
  const toggle = () => $('[data-action="filter"]');
  const panel = () => $('.filter-panel');
  const box = (key) => $(`.filter-panel input[data-filter="${key}"]`);
  const openPanel = async () => { if (!panel()) { toggle().click(); await wait(30); } };
  const setGroup = async (key, on) => { await openPanel(); if (box(key).checked !== on) { box(key).click(); await wait(30); } };
  const barTitles = () => $$('.cal-bar').map((b) => b.textContent);
  const listTitles = () => $$('.cal-event-title').map((x) => x.textContent);

  await goTo(2026, 10);
  check('필터 버튼 하나', $$('[data-action="filter"]').length === 1);
  toggle().click(); await wait(30);
  check('★ 필터 종류 3개: 부대·출타·기타', $$('.filter-option').map((o) => o.textContent).join(',') === '부대,출타,기타', $$('.filter-option').map((o) => o.textContent).join(','));
  check('처음엔 모두 체크', $$('.filter-panel input').every((i) => i.checked));
  check('색 점 3개, 서로 다른 색', $$('.filter-option .filter-dot').length === 3 && new Set($$('.filter-option .filter-dot').map((x) => w.getComputedStyle(x).backgroundColor)).size === 3);
  toggle().click(); await wait(30);

  await add('duty', '불침번', '2026-10-27');
  await add('other', '외래 진료', '2026-10-28');
  await goTo(2026, 10);
  $('.cal-day[data-date="2026-10-27"]').click(); await wait(30);
  check('켜진 상태: 훈련·불침번', ['훈련', '불침번'].every((t) => barTitles().includes(t)));

  await setGroup('unit', false);
  check('부대 끄기: 훈련·체육대회·점검 사라짐, 근무는 남음', !barTitles().includes('훈련') && !barTitles().includes('체육대회') && !barTitles().includes('생활관 점검') && barTitles().includes('불침번'));
  check('숨긴 일정 안내', $('.cal-hidden-note')?.textContent === '필터로 숨긴 일정 1개');
  check('필터 걸리면 버튼 강조', toggle().classList.contains('active') && toggle().getAttribute('aria-label') === '필터, 1개 종류 숨김');
  await setGroup('other', false);
  check('★ 기타 끄기: 근무·개인 일정 모두 숨김', !barTitles().includes('불침번') && !barTitles().includes('외래 진료'));
  await setGroup('unit', true);
  check('부대 다시 켜면 돌아옴', barTitles().includes('훈련'));
  await openPanel();
  $('[data-action="show-all"]').click(); await wait(30);
  check('모두 보기', $$('.filter-panel input').every((i) => i.checked) && !toggle().classList.contains('active'));
  $('.dday').click(); await wait(30);
  check('바깥 누르면 닫힘', !panel());

  // 출타: 신청 탭에서 휴가를 내고 달력 탭에서 출타를 끈다
  w.location.hash = '#apply'; await wait(80);
  const fd = await import('./js/data.js?frame-filter');
  const ws = fd.getApplyWindow().start;
  const [y, m, dd] = ws.split('-').map(Number);
  const pickDay = (() => { const x = new Date(y, m - 1, dd + 2); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; })();
  const nav = async () => { for (let i = 0; i < 3; i++) { const [cy, cm] = $('.apply-month').textContent.match(/\d+/g).map(Number); if (cy * 12 + cm === Number(pickDay.slice(0, 4)) * 12 + Number(pickDay.slice(5, 7))) return; $('[data-action="apply-next"]').click(); await wait(30); } };
  await nav();
  $(`.apply-day[data-date="${pickDay}"]`).click(); await wait(20); $(`.apply-day[data-date="${pickDay}"]`).click(); await wait(20);
  $('.apply-form').requestSubmit(); await wait(50);
  w.location.hash = '#calendar'; await wait(80);
  await goTo(Number(pickDay.slice(0, 4)), Number(pickDay.slice(5, 7)));
  check('휴가 막대 보임', barTitles().includes('휴가'));
  await setGroup('absence', false);
  check('★ 출타 끄기: 휴가 숨김', !barTitles().includes('휴가'));
  await setGroup('absence', true);
  check('출타 켜면 휴가 다시 보임', barTitles().includes('휴가'));
  check('360px 가로 넘침 없음', doc.documentElement.scrollWidth <= 360, doc.documentElement.scrollWidth);
} catch (err) { fail++; out.push('ERROR ' + err.stack); }
document.getElementById('result').textContent = `통과 ${pass} / 실패 ${fail}\n` + out.join('\n');
</script>
